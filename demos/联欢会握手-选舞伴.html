<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联欢会握手 · 选舞伴</title>
<meta name="description" content="每个女生选走一个舞伴。最后剩 7 个男生，再选走 1 个，剩下 6 个没舞伴——男生比女生多 6。">
<link rel="stylesheet" href="lib/anim.css">
<link rel="stylesheet" href="lib/bars.css">
<style>
  :root {
    --boy: #3d8bd8;
    --boy-deep: #1f5f9e;
    --girl: #e36b8a;
    --girl-deep: #b43d5c;
  }

  .floor {
    position: absolute;
    left: 40px; right: 40px; top: 128px;
  }
  .floor.gone { display: none; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 88px;
    padding: 10px 16px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0001;
    margin-bottom: 14px;
  }
  .who {
    flex: none;
    width: 88px;
    font-size: 15px;
    font-weight: 800;
    color: var(--girl-deep);
    line-height: 1.3;
  }
  .guys {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-height: 60px;
  }
  .n {
    flex: none;
    min-width: 64px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #1f5f9e;
  }
  .n.hot { color: #e0662c; }

  .person {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 32px;
    transition: opacity .4s, transform .45s;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .person:nth-child(2) { animation-delay: .2s; }
  .person:nth-child(3) { animation-delay: .35s; }
  .person:nth-child(4) { animation-delay: .1s; }
  .person:nth-child(5) { animation-delay: .3s; }
  .person:nth-child(6) { animation-delay: .45s; }
  .person:nth-child(7) { animation-delay: .15s; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .head {
    width: 20px; height: 20px;
    border-radius: 50%;
    z-index: 1;
  }
  .body {
    width: 16px; height: 20px;
    margin-top: -3px;
    border-radius: 7px 7px 5px 5px;
  }
  .person.boy .head {
    background: radial-gradient(circle at 32% 28%, #8ec6f5, var(--boy) 60%, var(--boy-deep));
  }
  .person.boy .body { background: var(--boy-deep); }
  .person.girl .head {
    background: radial-gradient(circle at 32% 28%, #f7b3c4, var(--girl) 60%, var(--girl-deep));
  }
  .person.girl .body { background: var(--girl-deep); }
  .person.gone {
    opacity: 0;
    transform: translateX(40px) translateY(-8px);
    animation: none;
  }
  .person.left {
    outline: 3px solid #e0662c55;
    border-radius: 10px;
  }

  .pair-off {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 0 4px;
    border-radius: 12px;
    background: #fff6d8;
    transition: opacity .4s, transform .45s;
  }
  .pair-off.away {
    opacity: 0;
    transform: translateX(46px);
  }

  .note {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #8a5a10;
    min-height: 32px;
    margin-top: 8px;
  }
  .note b { color: #e0662c; }

  .bar-box {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  .bar-box.show { opacity: 1; }
</style>
</head>
<body>

<h1>联欢会握手：选走一个，剩下的就是多出来的</h1>
<div class="problem">
  男生都到了。女生一个一个来，跟还在的男生握手，<b>选一个舞伴带走</b>。最后一个女生来时还剩 <b>7</b> 个男生。男生比女生多几个？
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="floor" id="floor">
      <div class="row" id="rowBoys">
        <div class="who">还在的<br>男生</div>
        <div class="guys" id="guys"></div>
        <div class="n" id="num">7</div>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div class="bar-box" id="barBox"></div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script src="lib/bars.js"></script>
<script>
const { sleep, cancelled, say, pop } = Anim;

const bars = Bars.create({
  stage: document.getElementById('barBox'),
  items: [
    { name: '男生', color: '#3d8bd8' },
    { name: '女生', color: '#e36b8a' },
  ],
  scale: 9,
  unit: ' 人',
  padding: 170,
});

function person(kind) {
  const el = document.createElement('div');
  el.className = 'person ' + kind;
  el.innerHTML = '<div class="head"></div><div class="body"></div>';
  return el;
}

function fillGuys(n) {
  const box = document.getElementById('guys');
  box.innerHTML = '';
  for (let i = 0; i < n; i++) box.appendChild(person('boy'));
  document.getElementById('num').textContent = n;
  document.getElementById('num').className = 'n';
}

function showFloor(on) {
  document.getElementById('floor').classList.toggle('gone', !on);
  document.getElementById('barBox').classList.toggle('show', !on);
}

function resetVisuals() {
  fillGuys(7);
  document.getElementById('note').textContent = '';
  showFloor(true);
  bars.reset();
  bars.set([0, 0]);
}

async function pickOne(id) {
  const box = document.getElementById('guys');
  const boys = [...box.querySelectorAll('.person.boy')];
  const last = boys[boys.length - 1];
  if (!last) return;
  const girl = person('girl');
  const wrap = document.createElement('div');
  wrap.className = 'pair-off';
  last.replaceWith(wrap);
  wrap.appendChild(girl);
  wrap.appendChild(last);
  last.classList.add('left');
  await sleep(600);
  if (cancelled(id)) return;
  wrap.classList.add('away');
  await sleep(400);
  if (cancelled(id)) return;
  wrap.remove();
}

Anim.run([
  {
    title: '男生都到了',
    async play(id) {
      fillGuys(7);
      document.getElementById('num').textContent = '?';
      document.getElementById('num').className = 'n';
      document.getElementById('guys').innerHTML = '';
      for (let i = 0; i < 7; i++) {
        document.getElementById('guys').appendChild(person('boy'));
      }
      const more = document.createElement('span');
      more.style.cssText = 'color:#8aa0b3;font-weight:800;padding-bottom:10px';
      more.textContent = '……还有';
      document.getElementById('guys').appendChild(more);
      say('先到', '男生先到齐了。女生一个一个来，跟还在的人握手，<b>选一个舞伴带走</b>。');
      document.getElementById('note').innerHTML = '每走一对，台上男生少 <b>1</b> 个';
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '带走一对',
    async play(id) {
      fillGuys(7);
      document.getElementById('num').textContent = '还多';
      say('选走', '前面每个女生都这样：握过手，选走一个。台上的男生一个一个少。');
      await sleep(500);
      if (cancelled(id)) return;
      await pickOne(id);
      if (cancelled(id)) return;
      document.getElementById('num').textContent = '少 1';
      pop('带走 1 个');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
  {
    title: '最后剩 7 个',
    async play(id) {
      fillGuys(7);
      document.getElementById('num').classList.add('hot');
      document.getElementById('note').innerHTML = '最后一个女生来了，台上还剩 <b>7</b> 个';
      say('还剩 7', '轮到最后一个女生。台上只剩 <b>7</b> 个男生。她跟这 7 个都握过手。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '她也选走 1 个',
    async play(id) {
      fillGuys(7);
      document.getElementById('num').classList.add('hot');
      say('选舞伴', '她也要选一个舞伴带走。7 个里面走掉 1 个。');
      await sleep(400);
      if (cancelled(id)) return;
      await pickOne(id);
      if (cancelled(id)) return;
      document.getElementById('num').textContent = '6';
      document.getElementById('note').innerHTML = '7 − 1 = <b>6</b> 个男生没舞伴';
      pop('剩下 6 个');
      await sleep(500);
      if (cancelled(id)) return;
    }
  },
  {
    title: '剩下的就是多出来的',
    async play(id) {
      fillGuys(6);
      document.getElementById('num').textContent = '6';
      document.getElementById('num').classList.add('hot');
      document.getElementById('note').innerHTML = '每个女生带走 1 个，剩下的就是男生多的';
      say('多 6', '每个女生都带走了一个。现在还剩 <b>6</b> 个男生没舞伴——男生比女生<b>多 6</b>。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '一共 50，多 6',
    async play(id) {
      showFloor(false);
      bars.set([28, 22]);
      say('和差', '一共 <b>50</b> 人，男生多 6。把多的 6 拿掉，剩下两份一样长。');
      await sleep(500);
      if (cancelled(id)) return;
      bars.diff(0, 1, '多 6');
      await sleep(500);
      if (cancelled(id)) return;
      bars.showNumbers(true);
    }
  },
  {
    title: '男生 28 人',
    async play(id) {
      showFloor(false);
      bars.set([28, 22]);
      bars.showNumbers(true);
      bars.diff(0, 1, '多 6');
      say('答案', '男生 <b>28</b> 人，女生 22 人。（50 + 6）÷ 2 = 28。');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
