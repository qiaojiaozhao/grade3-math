<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸡兔同笼 · 动态演示</title>
<meta name="description" content="8 只鸡站成一排，一只只被添上脚变成兔。脚数尺每次只前进 2 格，填满那段空缺正好 5 步——「除以 2」是看得见的。">
<link rel="stylesheet" href="lib/anim.css">
<style>
  /* 这道题专有的东西：一排会变身的小动物、一把脚数尺。
     页面外壳、旁白气泡、播放控件都在 lib/anim.css 里。 */
  :root {
    --chick: #f6c445;
    --chick-deep: #e0a010;
    --bun: #c49a78;
    --bun-deep: #9c7250;
    --leg: #7a5a36;
  }

  /* ---------- 脚数尺 ---------- */
  .meter-wrap {
    position: absolute;
    /* 尺子上方那行「脚：N」是往上伸的（top:-34），所以整条尺要离旁白气泡
       远一点。气泡底边在 90px 左右，134 - 34 = 100，留 10px 富余。 */
    left: 40px; right: 40px; top: 134px;
    z-index: 4;
  }
  .meter {
    position: relative;
    height: 34px;
    background: #e9eef4;
    border-radius: 999px;
    box-shadow: inset 0 2px 5px #0001;
    overflow: visible;
  }
  .meter-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--chick), var(--chick-deep));
  }
  /* 已经填到的地方和目标之间的缺口，就是「少的脚」 */
  .meter-gap {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 4px;
    background: repeating-linear-gradient(45deg, #c0392b33 0 7px, #c0392b11 7px 14px);
    border: 2px dashed #c0392b88;
    opacity: 0;
    transition: opacity .35s;
  }
  .meter-gap.show { opacity: 1; }
  .meter-gap span {
    position: absolute; left: 50%; top: -28px;
    transform: translateX(-50%);
    font-size: 15px; font-weight: 800; color: #c0392b;
    white-space: nowrap;
  }
  .meter-target {
    position: absolute;
    top: -8px; bottom: -8px;
    width: 3px;
    /* 线要骑在 26 这个位置上，不能从它右边开始长 ——
       最后一幕「正好填满到红线」是这段动画的落点，差几像素都看得出来 */
    transform: translateX(-50%);
    background: #c0392b;
    border-radius: 2px;
  }
  .meter-target span {
    position: absolute; left: 50%; bottom: -26px;
    transform: translateX(-50%);
    font-size: 14px; font-weight: 800; color: #c0392b;
    white-space: nowrap;
  }
  .meter-num {
    position: absolute;
    left: 0; top: -34px;
    font-size: 19px; font-weight: 800; color: #6b4f2d;
    white-space: nowrap;
  }
  .meter-num b {
    display: inline-block;
    color: #e0662c; font-size: 23px;
    transform-origin: center;
  }
  /* 脚数往上跳的时候数字弹一下，强化「只走了 2」 */
  .meter-num.bump b { animation: bump .45s ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.38); }
    100% { transform: scale(1); }
  }

  .swap-badge {
    position: absolute;
    right: 0; top: -34px;
    font-size: 17px; font-weight: 800; color: #2c6fb3;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .3s;
  }
  .swap-badge.show { opacity: 1; }

  /* ---------- 小动物 ---------- */
  /* 身体是图片，腿是 CSS。这个分工是有意的：
     「添 2 只脚」是这段动画的命门，腿必须是能一根根数清楚的元素，
     交给图片就说不清了。图片只负责好看。 */
  .animal {
    position: absolute;
    bottom: 86px;
    width: 84px;
    height: 150px;
    z-index: 2;
  }
  .animal .art {
    position: absolute;
    left: 0; right: 0;
    bottom: 22px;          /* 往下探一点，腿看着像从身体里长出来的 */
    height: 118px;
    background-repeat: no-repeat;
    background-size: contain;
    /* 贴着底边对齐，鸡和兔虽然一高一矮，也站在同一条线上 */
    background-position: bottom center;
    transform-origin: bottom center;
    transition: opacity .5s, filter .5s;
    /* 待机时轻轻起伏。完全静止的角色最显死板，每只错开一点相位 */
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-2px) scaleY(1.018); }
  }
  .art-chick { background-image: url(assets/鸡.png); }
  /* 兔子图里身体只占画面宽度的七成左右，两边是耳朵和尾巴；
     按和鸡一样的框缩放，身体会明显小一圈。给它一个略宽略高的框补回来。 */
  .art-bun {
    background-image: url(assets/兔.png);
    left: -6px; right: -6px;
    height: 126px;
    opacity: 0;
  }
  .animal.rabbit .art-chick { opacity: 0; }
  .animal.rabbit .art-bun   { opacity: 1; }

  .animal .legs {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 26px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 9px;
  }
  .animal .leg {
    width: 8px; height: 26px;
    border-radius: 3px;
    background: var(--leg);
  }
  /* 外侧两条是「添上去」的那两只脚 */
  .animal .leg.extra {
    transform: scaleY(0);
    transform-origin: top center;
    opacity: 0;
    transition: transform .5s cubic-bezier(.2,1.5,.3,1), opacity .3s;
  }

  .animal.rabbit .leg.extra { transform: scaleY(1); opacity: 1; }

  /* 还看不出是鸡是兔的时候，压成灰剪影 */
  .animal.unknown .art-chick { filter: grayscale(1) brightness(1.12) contrast(.75); }
  .animal.unknown .leg { background: #9aa4ad; }
  .animal .qmark {
    position: absolute;
    left: 0; right: 0; bottom: 62px;
    text-align: center;
    font-size: 30px; font-weight: 800; color: #5b6772;
    text-shadow: 0 2px 5px #fff, 0 0 10px #fff;
    opacity: 0;
    transition: opacity .3s;
  }
  .animal.unknown .qmark { opacity: 1; }

  /* 数脚的时候点名用 */
  .animal.spot { animation: spot .5s ease; }
  @keyframes spot {
    50% { transform: translateY(-14px); }
  }

  /* 变身那一下压一下再弹回来。动画十二原则里的 squash & stretch，
     一个关键帧就能让「咔哒」那一下有分量 */
  .animal { transform-origin: bottom center; }
  .animal.squash { animation: squash .55s ease-out; }
  @keyframes squash {
    0%   { transform: scaleX(1)    scaleY(1); }
    30%  { transform: scaleX(1.12) scaleY(.87); }
    62%  { transform: scaleX(.96)  scaleY(1.05); }
    100% { transform: scaleX(1)    scaleY(1); }
  }

  .animal .tick {
    position: absolute;
    left: 0; right: 0; bottom: -26px;
    text-align: center;
    font-size: 15px; font-weight: 800; color: #2c6fb3;
    opacity: 0;
    transition: opacity .3s;
  }
  .animal .tick.show { opacity: 1; }

  /* 「+2」飘一下，强调每次只添两只 */
  .plus2 {
    position: absolute;
    font-size: 22px; font-weight: 800; color: #c0392b;
    text-shadow: 0 2px 0 #fff;
    pointer-events: none;
    z-index: 7;
    opacity: 0;
  }
  .plus2.go { animation: plus2 1.1s ease-out forwards; }
  @keyframes plus2 {
    0%   { opacity: 0; transform: translateY(6px) scale(.7); }
    25%  { opacity: 1; transform: translateY(-6px) scale(1.1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-34px) scale(1); }
  }

  /* ---------- 竖版 1080×1920 ---------- */
  /* anim.css 里 portrait 会把舞台拉满整个画幅，但这道题的东西是按 500px 高的
     坐标定的：旁白钉在顶、小鸡站在桌沿。舞台一拉高，中间就空出一大片。
     所以这里不让舞台吃掉剩余高度，改成给它一个够用的高度、整块垂直居中，
     再把小鸡和脚数尺放大一倍——竖版看的是手机，小了根本数不清腿。 */
  body.portrait { justify-content: center; }
  body.portrait h1 { font-size: 44px; margin-bottom: 18px; }
  body.portrait .problem { font-size: 27px; line-height: 1.7; padding: 20px 26px; }
  body.portrait .speech { font-size: 29px; min-height: 130px; padding: 20px 26px; }
  body.portrait .speech .tag { font-size: 21px; padding: 2px 12px; }
  body.portrait .spark { font-size: 52px; }
  body.portrait .stage-wrap { flex: none; }
  body.portrait .stage {
    height: 1080px;
    --table-edge: 208px;
    --table-face: 176px;
  }

  body.portrait .meter-wrap { left: 56px; right: 56px; top: 270px; }
  body.portrait .meter { height: 52px; }
  body.portrait .meter-num { top: -50px; font-size: 30px; }
  body.portrait .meter-num b { font-size: 36px; }
  body.portrait .swap-badge { top: -50px; font-size: 26px; }
  body.portrait .meter-gap { border-radius: 6px; }
  body.portrait .meter-gap span { top: -40px; font-size: 24px; }
  body.portrait .meter-target { width: 5px; top: -12px; bottom: -12px; }
  body.portrait .meter-target span { bottom: -38px; font-size: 22px; }

  /* 小鸡放大三成半。不能再大：8 只要在 1080 宽里排开还不互相压住，
     一只顶多 112 宽（8×112 + 7×16 的间距刚好吃满）。腿要一根根数清楚，
     跟着一起加粗加长。 */
  body.portrait .animal { width: 112px; height: 200px; bottom: 140px; }
  body.portrait .animal .art { height: 158px; bottom: 30px; }
  body.portrait .animal .art-bun { left: -8px; right: -8px; height: 168px; }
  body.portrait .animal .legs { height: 35px; gap: 12px; }
  body.portrait .animal .leg { width: 11px; height: 35px; border-radius: 4px; }
  body.portrait .animal .qmark { bottom: 84px; font-size: 40px; }
  body.portrait .animal .tick { bottom: -36px; font-size: 22px; }
  body.portrait .plus2 { font-size: 32px; }
</style>
</head>
<body>

<h1>鸡兔同笼：把鸡一只只换成兔</h1>
<div class="problem">
  笼子里关着鸡和兔。数一数，一共有 <b>8 个头</b>，<b>26 只脚</b>。鸡和兔各有几只？
</div>

<div class="stage-wrap">
  <div class="stage has-table" id="stage">
    <div class="meter-wrap">
      <div class="meter-num" id="meterNum">脚：<b>0</b></div>
      <div class="swap-badge" id="swapBadge">已换 0 只兔</div>
      <div class="meter">
        <div class="meter-fill" id="meterFill"></div>
        <div class="meter-gap" id="meterGap"><span></span></div>
        <div class="meter-target" id="meterTarget"><span>要凑够 26</span></div>
      </div>
    </div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script>
const { sleep, cancelled, tween, lerp, say, pop } = Anim;

const N = 8;            // 头的总数
const TARGET = 26;      // 脚的总数
const SCALE_MAX = 32;   // 脚数尺画到 32，26 才不会顶到最右边

const stage = document.getElementById('stage');
const meterFill = document.getElementById('meterFill');
const meterGap = document.getElementById('meterGap');
const meterNum = document.getElementById('meterNum');
const meterTarget = document.getElementById('meterTarget');
const swapBadge = document.getElementById('swapBadge');

// 八只小动物一次性建出来，之后只切换它们的类
const animals = [];
for (let i = 0; i < N; i++) {
  const el = document.createElement('div');
  el.className = 'animal unknown';
  el.innerHTML =
    '<div class="art art-chick"></div>' +
    '<div class="art art-bun"></div>' +
    '<div class="qmark">?</div>' +
    '<div class="legs">' +
      '<div class="leg extra"></div><div class="leg"></div>' +
      '<div class="leg"></div><div class="leg extra"></div>' +
    '</div>' +
    '<div class="tick"></div>';
  // 呼吸错开相位，不然八只一起起伏像机器
  el.querySelectorAll('.art').forEach((a) => { a.style.animationDelay = (i * 0.19) + 's'; });
  stage.appendChild(el);
  animals.push(el);
}

function layout() {
  const W = stage.clientWidth;
  // 宽度从元素上量，别写死：竖版里小鸡放大了一倍，写死会算出重叠的间距
  const AW = animals[0].offsetWidth || 84;
  const PAD = Math.round(AW * 0.55);
  const step = (W - PAD * 2 - AW) / (N - 1);
  animals.forEach((el, i) => { el.style.left = (PAD + step * i) + 'px'; });
}
layout();
addEventListener('resize', layout);

meterTarget.style.left = (TARGET / SCALE_MAX * 100) + '%';

let legs = 0;
let rabbits = 0;

function setLegs(v) {
  legs = v;
  meterFill.style.width = (Math.max(v, 0) / SCALE_MAX * 100) + '%';
  meterNum.innerHTML = '脚：<b>' + Math.round(v) + '</b>';
}

function bumpNum() {
  meterNum.classList.remove('bump');
  void meterNum.offsetWidth;   // 逼浏览器重算，否则连续两次不会重播
  meterNum.classList.add('bump');
}

function showGap(from, to, text) {
  meterGap.style.left = (from / SCALE_MAX * 100) + '%';
  meterGap.style.width = ((to - from) / SCALE_MAX * 100) + '%';
  meterGap.querySelector('span').textContent = text;
  meterGap.classList.add('show');
}
function hideGap() { meterGap.classList.remove('show'); }

function setRabbits(n) {
  rabbits = n;
  animals.forEach((el, i) => {
    el.classList.remove('unknown');
    el.classList.toggle('rabbit', i < n);
  });
  swapBadge.textContent = '已换 ' + n + ' 只兔';
}

/** 在某只动物头顶飘一个「+2」 */
function plus2At(i) {
  const el = document.createElement('div');
  el.className = 'plus2 go';
  el.textContent = '+2';
  // 飘在身体右侧、旁白泡泡「26 − 16 = 10」那行字的下方，两边不打架
  el.style.left = (animals[i].offsetLeft + 72) + 'px';
  el.style.bottom = (86 + 86) + 'px';
  stage.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

/** 把第 i 只鸡添上两只脚变成兔，脚数条同步前进 2 */
async function swapOne(i, id) {
  animals[i].classList.add('rabbit');
  animals[i].classList.remove('squash');
  void animals[i].offsetWidth;
  animals[i].classList.add('squash');
  plus2At(i);
  bumpNum();
  const from = legs;
  await tween(520, id, (e) => setLegs(lerp(from, from + 2, e)));
  if (cancelled(id)) return;
  rabbits = i + 1;
  swapBadge.textContent = '已换 ' + rabbits + ' 只兔';
}

/** 每一幕开始前由引擎调用，把上一幕的痕迹清干净 */
function resetVisuals() {
  hideGap();
  swapBadge.classList.remove('show');
  meterNum.classList.remove('bump');
  stage.querySelectorAll('.plus2').forEach((el) => el.remove());
  animals.forEach((el) => {
    el.classList.remove('spot', 'squash');
    el.querySelector('.tick').classList.remove('show');
    el.querySelector('.tick').textContent = '';
  });
}

Anim.run([
  {
    title: '笼子里有什么',
    async play(id) {
      animals.forEach((el) => { el.className = 'animal unknown'; });
      setLegs(0);
      say('题目', '笼子里有鸡也有兔，<b>看不出谁是谁</b>。只知道一共 8 个头、26 只脚。');
      await sleep(900);
      if (cancelled(id)) return;
      say('先数头', '8 个头，就是 <b>8 只动物</b>。不管怎么分，鸡加兔一定是 8。');
      await sleep(600);
      if (cancelled(id)) return;
      pop('鸡 + 兔 = 8');
    }
  },
  {
    title: '先当全是鸡',
    async play(id) {
      setRabbits(0);
      setLegs(0);
      say('假设', '先来个大胆的假设：<b>假装 8 只全是鸡</b>。兔子先委屈一下，也当成鸡。');
      await sleep(700);
      if (cancelled(id)) return;
      for (let i = 0; i < N; i++) {
        animals[i].classList.add('spot');
        await sleep(110);
        if (cancelled(id)) return;
      }
      await sleep(400);
      if (cancelled(id)) return;
      say('每只 2 只脚', '鸡只有 <b>2 只脚</b>。现在这一排全是两条腿的。');
    }
  },
  {
    title: '数一数有多少只脚',
    async play(id) {
      setRabbits(0);
      setLegs(0);
      say('数脚', '一只一只数过去，<b>每只加 2</b>。看尺子往前走。');
      await sleep(500);
      if (cancelled(id)) return;
      for (let i = 0; i < N; i++) {
        animals[i].classList.add('spot');
        const tick = animals[i].querySelector('.tick');
        tick.textContent = (i + 1) * 2;
        tick.classList.add('show');
        const from = legs;
        await tween(220, id, (e) => setLegs(lerp(from, from + 2, e)));
        if (cancelled(id)) return;
        animals[i].classList.remove('spot');
        await sleep(90);
        if (cancelled(id)) return;
      }
      await sleep(500);
      if (cancelled(id)) return;
      pop('2 × 8 = 16 只脚');
      say('才 16 只', '全当成鸡的话，只有 <b>16 只脚</b>。可题目说有 26 只。');
    }
  },
  {
    title: '少了多少只脚',
    async play(id) {
      setRabbits(0);
      setLegs(16);
      say('对比', '红线是题目要的 26。我们只数到 16，<b>中间空了一截</b>。');
      await sleep(800);
      if (cancelled(id)) return;
      showGap(16, TARGET, '少了 10 只脚');
      await sleep(900);
      if (cancelled(id)) return;
      pop('26 − 16 = 10');
      say('少的脚在哪', '这 10 只脚，是被我们<b>当成鸡而藏起来</b>的——它们本来长在兔子身上。');
    }
  },
  {
    title: '换一只，只多 2 只脚',
    async play(id) {
      setRabbits(0);
      setLegs(16);
      showGap(16, TARGET, '还差 10 只');
      swapBadge.classList.add('show');
      say('关键', '把第一只鸡变回兔。注意看：它<b>不是重新长 4 只脚</b>，而是在原来 2 只上<b>再添 2 只</b>。');
      await sleep(1100);
      if (cancelled(id)) return;
      await swapOne(0, id);
      if (cancelled(id)) return;
      showGap(18, TARGET, '还差 8 只');
      await sleep(500);
      if (cancelled(id)) return;
      pop('只多了 2，不是 4！');
      say('每次 +2', '尺子只往前走了 <b>2 格</b>：16 变 18。这就是为什么后面要<b>除以 2</b>。');
    }
  },
  {
    title: '一直换到 26',
    async play(id) {
      setRabbits(1);
      setLegs(18);
      swapBadge.classList.add('show');
      showGap(18, TARGET, '还差 8 只');
      say('继续', '还差 8 只脚，就继续换。<b>数一数一共换了几只</b>。');
      await sleep(800);
      if (cancelled(id)) return;
      for (let i = 1; i < 5; i++) {
        await swapOne(i, id);
        if (cancelled(id)) return;
        const left = TARGET - legs;
        if (left > 0) showGap(legs, TARGET, '还差 ' + Math.round(left) + ' 只');
        else hideGap();
        await sleep(550);
        if (cancelled(id)) return;
      }
      hideGap();
      await sleep(400);
      if (cancelled(id)) return;
      pop('换了 5 只，正好 26');
      say('数出来了', '一共换了 <b>5 只</b>，脚数正好填满到 26。所以兔有 5 只。');
    }
  },
  {
    title: '答案',
    async play(id) {
      setRabbits(5);
      setLegs(TARGET);
      swapBadge.classList.add('show');
      say('算式', '少的 10 只脚，每换一只补 2 只：<b>10 ÷ 2 = 5</b> 只兔。头一共 8 个，<b>8 − 5 = 3</b> 只鸡。');
      await sleep(1400);
      if (cancelled(id)) return;
      animals.forEach((el, i) => {
        const tick = el.querySelector('.tick');
        tick.textContent = i < 5 ? '兔' : '鸡';
        tick.classList.add('show');
      });
      await sleep(900);
      if (cancelled(id)) return;
      pop('兔 5 只，鸡 3 只');
      say('验算', '头：3 + 5 = 8 ✓　脚：3×2 + 5×4 = 6 + 20 = 26 ✓　<b>兔 5 只，鸡 3 只</b>。');
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
