<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>一张图，五种问法 · 动态演示</title>
<meta name="description" content="哥哥 42 颗、弟弟 14 颗。藏起不同的数，就是和差、和倍、差倍、移多补少、年龄五道题——答案都是 14，因为是同一张图。">
<link rel="stylesheet" href="lib/anim.css?v=portrait">
<style>
  html, body { background: #07080a; }

  :root {
    --stage-h: 560px;
    --big: #6ea8ff;
    --kid: #c084fc;
    --gap: #ff8a3d;
    --grow: #5ecf8a;
  }

  .stage {
    --u: 12px;
    --L: 118px;
    --rowA: 176px;
    --rowB: 252px;
    --bh: 46px;
    --fs: 15px;
  }
  body.portrait .stage {
    --u: 15px;
    --L: 150px;
    --rowA: 580px;
    --rowB: 770px;
    --bh: 100px;
    --fs: 26px;
  }

  .ask {
    position: absolute;
    left: 50%; top: 112px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
    font-size: 17px; font-weight: 800;
    color: #e8eaed;
  }
  body.portrait .ask { top: 380px; font-size: 30px; gap: 16px; flex-direction: column; }
  .ask:empty { display: none; }
  .ask .no {
    background: var(--gap); color: #1a1208;
    border-radius: 999px; padding: 3px 12px;
  }
  body.portrait .ask .no { padding: 6px 22px; }
  .ask.pop { animation: bump-center .45s cubic-bezier(.2, 1.6, .3, 1); }

  .name {
    position: absolute;
    left: 0;
    width: calc(var(--L) - 18px);
    height: var(--bh);
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    font-size: 18px; font-weight: 800; color: #e8c27a;
    line-height: 1.15;
  }
  body.portrait .name { font-size: 32px; }
  .name small { font-size: 20px; color: #f4f6f8; }
  body.portrait .name small { font-size: 36px; }
  .name small.pop { animation: bump .45s cubic-bezier(.2, 1.6, .3, 1); }
  #nameA { top: var(--rowA); }
  #nameB { top: var(--rowB); }

  .seg {
    position: absolute;
    height: var(--bh);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs); font-weight: 800;
    color: #1a1208;
    white-space: nowrap;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: inset 0 1px 0 #fff4, inset 0 -2px 0 #0002;
  }
  .seg.big { background: linear-gradient(180deg, #a3c6ff, var(--big)); }
  .seg.kid { background: linear-gradient(180deg, #dab4ff, var(--kid)); }
  .seg.gap { background: linear-gradient(180deg, #ffb070, var(--gap)); }
  .seg.grow { background: linear-gradient(180deg, #9ae8b6, var(--grow)); }
  .seg.part { border-left: 3px dashed #1a1208aa; }
  .seg.dim { opacity: .3; }
  .seg.fly { box-shadow: 0 10px 24px #0009, inset 0 1px 0 #fff4; z-index: 2; }

  .cut {
    position: absolute;
    top: calc(var(--rowA) - 16px);
    height: calc(var(--rowB) - var(--rowA) + var(--bh) + 32px);
    border-left: 3px dashed #ffb347cc;
    display: none;
  }
  .cut.on { display: block; }

  .sum {
    position: absolute;
    left: calc(var(--L) + var(--u) * 43.5);
    top: var(--rowA);
    height: calc(var(--rowB) - var(--rowA) + var(--bh));
    width: 16px;
    border: 3px solid #e8c27a;
    border-left: none;
    border-radius: 0 12px 12px 0;
    display: none;
  }
  .sum.on { display: block; }
  .sum span {
    position: absolute;
    left: 26px; top: 50%;
    transform: translateY(-50%);
    font-size: 17px; font-weight: 800; color: #e8c27a;
    white-space: nowrap;
  }
  body.portrait .sum span { font-size: 30px; left: 30px; }

  .count {
    position: absolute;
    left: 0; right: 0;
    top: calc(var(--rowB) + var(--bh) + 44px);
    min-height: 36px;
    text-align: center;
    font-size: 24px; font-weight: 800;
    color: #ffb347;
  }
  body.portrait .count { top: calc(var(--rowB) + var(--bh) + 110px); font-size: 46px; }
  .count b { color: #ff8a3d; }
  .count.pop { animation: bump .45s cubic-bezier(.2, 1.6, .3, 1); }

  .recap {
    position: absolute;
    left: 50%;
    top: calc(var(--rowB) + var(--bh) + 26px);
    transform: translateX(-50%);
    display: none;
    grid-template-columns: auto auto;
    gap: 2px 22px;
    font-size: 17px; font-weight: 800;
    white-space: nowrap;
  }
  body.portrait .recap { top: calc(var(--rowB) + var(--bh) + 80px); font-size: 36px; gap: 18px 36px; }
  .recap.on { display: grid; }
  .recap .k { color: #e8c27a; text-align: right; }
  .recap .v { color: #f4f6f8; }
  .recap .v b { color: #ff8a3d; }
  .recap .hide { visibility: hidden; }

  @keyframes bump {
    0% { transform: scale(.75); }
    55% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes bump-center {
    0% { transform: translateX(-50%) scale(.75); }
    55% { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body class="theme-dark">

<h1>一张图，五种问法：第一单元总复习</h1>
<div class="problem">
  哥哥有 <b>42</b> 颗糖，弟弟有 <b>14</b> 颗。出题人每次藏起几个数，就变成第一单元的一道题。
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="ask" id="ask"></div>
    <div class="name" id="nameA">弟弟</div>
    <div class="name" id="nameB">哥哥</div>
    <div id="board"></div>
    <div class="cut" id="cut"></div>
    <div class="sum" id="sum"><span></span></div>
    <div class="count" id="count"></div>
    <div class="recap" id="recap"></div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script>
const { sleep, cancelled, tween, lerp, say, pop } = Anim;

const KID = 14;
const GAP = 28;
const BIG = KID + GAP;
const TOTAL = BIG + KID;
const TIMES = 3;
const TIMES2 = 2;
const GIVE = GAP / 2;
const ADD = GAP / (TIMES2 - 1) - KID;
const CIRCLED = ['', '①', '②', '③', '④'];

const board = document.getElementById('board');
const cut = document.getElementById('cut');
const sum = document.getElementById('sum');
const ask = document.getElementById('ask');
const nameA = document.getElementById('nameA');
const nameB = document.getElementById('nameB');
const countEl = document.getElementById('count');
const recap = document.getElementById('recap');

/* 上面一行（row 0）是弟弟，下面一行（row 1）是哥哥。x、w 都以「颗」为单位。 */
function seg(row, x, w, cls, text = '', style = '') {
  const el = document.createElement('div');
  el.className = 'seg ' + cls;
  el.style.cssText =
    `top: calc(var(--rowA) + (var(--rowB) - var(--rowA)) * ${row});` +
    `left: calc(var(--L) + var(--u) * ${x});` +
    `width: calc(var(--u) * ${Math.max(w, 0)});` + style;
  el.textContent = text;
  board.append(el);
}

/* 画面状态：
   mode  哥哥那根怎么画：plain 一整根 / gap 分出多出来的一截 / cut 拿走那一截 /
         parts 切成和弟弟一样长的 3 份 / move 把一半送给弟弟
   t     cut、move 的进度；g 两人各加了几颗（绿色）
   line  竖线画在哪；sum 右边「一共」括号上的字；vals 名字下面显示的数 */
function paint(s) {
  board.innerHTML = '';
  const g = s.g || 0;
  const t = s.t || 0;

  seg(0, 0, KID, 'kid', s.kidText || '');
  if (g > 0.01) seg(0, KID, g, 'grow', g >= 4 ? `+${Math.round(g)}` : '');

  switch (s.mode) {
    case 'gap':
      seg(1, 0, KID, 'big');
      if (g > 0.01) seg(1, KID, g, 'grow', g >= 4 ? `+${Math.round(g)}` : '');
      seg(1, KID + g, GAP, 'gap', s.gapText || '');
      break;
    case 'cut':
      seg(1, 0, KID, 'big');
      seg(1, KID, GAP, 'gap', '先拿走', `opacity:${1 - t};transform:translateX(calc(var(--u) * ${t * 6}));`);
      break;
    case 'parts': {
      const lab = s.labels || [];
      seg(1, 0, KID, 'big' + (s.dimFirst ? ' dim' : ''), lab[0] || '');
      for (let i = 1; i < TIMES; i++) seg(1, KID * i, KID, 'gap part', lab[i] || '');
      break;
    }
    case 'move':
      seg(1, 0, KID, 'big');
      seg(1, KID, GIVE, 'gap', '留下');
      seg(1 - t, lerp(KID + GIVE, KID, t), GIVE, 'gap fly', '送过去');
      break;
    default:
      seg(1, 0, BIG, 'big');
  }

  cut.classList.toggle('on', s.line != null);
  if (s.line != null) cut.style.left = `calc(var(--L) + var(--u) * ${s.line})`;

  sum.classList.toggle('on', !!s.sum);
  sum.firstElementChild.textContent = s.sum || '';

  const [a, b] = s.vals || [];
  nameA.innerHTML = '弟弟' + (a != null ? `<small>${Math.round(a)}</small>` : '');
  nameB.innerHTML = '哥哥' + (b != null ? `<small>${Math.round(b)}</small>` : '');
}

function bump(el, cls = 'pop') {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function setAsk(no, text) {
  ask.innerHTML = `<span class="no">${no}</span><span>${text}</span>`;
  bump(ask);
}

function setCount(html) {
  countEl.innerHTML = html;
  bump(countEl);
}

const RECAP = [
  ['和差', `(${TOTAL} − ${GAP}) ÷ 2 = <b>${KID}</b>`],
  ['和倍', `${TOTAL} ÷ (${TIMES} + 1) = <b>${KID}</b>`],
  ['差倍', `${GAP} ÷ (${TIMES} − 1) = <b>${KID}</b>`],
  ['移多补少', `${GAP} ÷ 2 = <b>${GIVE}</b>`],
  ['一起长', `${GAP} − ${KID} = <b>${ADD}</b>`],
];

function showRecap(n) {
  recap.innerHTML = RECAP.map(([k, v], i) => {
    const hide = i < n ? '' : ' hide';
    return `<span class="k${hide}">${k}</span><span class="v${hide}">${v}</span>`;
  }).join('');
  recap.classList.add('on');
}

function resetVisuals() {
  countEl.innerHTML = '';
  countEl.classList.remove('pop');
  ask.innerHTML = '';
  recap.classList.remove('on');
  paint({ mode: 'plain' });
}

Anim.run([
  {
    title: '两根条子',
    async play(id) {
      paint({ mode: 'plain' });
      say('先看', '先<b>不看数字</b>。上面是弟弟的糖，下面是哥哥的糖。<b>左边对齐</b>，一比就知道谁多。');
      await sleep(1000);
      if (cancelled(id)) return;
    }
  },
  {
    title: '多出来的一截',
    async play(id) {
      paint({ mode: 'plain', line: KID });
      say('画线', '在弟弟的末尾画一条竖线。哥哥<b>超出这条线的那一截</b>，就是多出来的。');
      await sleep(900);
      if (cancelled(id)) return;
      paint({ mode: 'gap', line: KID, gapText: '多出来的一截' });
      pop('五道题都在问这一截');
      await sleep(1200);
      if (cancelled(id)) return;
      say('画线', '接下来五道题用的都是<b>这一张图</b>，只是每次藏起来的数不一样。');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '第 1 问 · 和差',
    async play(id) {
      setAsk('第 1 问 · 和差', `一共 ${TOTAL} 颗，哥哥比弟弟多 ${GAP} 颗`);
      paint({ mode: 'gap', line: KID, gapText: `多 ${GAP}`, sum: `一共 ${TOTAL}` });
      say('和差', '知道<b>一共</b>，也知道<b>多出来的一截</b>。不能直接平分，先把这一截拿走。');
      await sleep(1200);
      if (cancelled(id)) return;
      await tween(1100, id, (e) => paint({ mode: 'cut', t: e, line: KID, sum: `一共 ${TOTAL}` }));
      if (cancelled(id)) return;
      say('和差', '剩下两根<b>一样长</b>，平分，一份就是弟弟。');
      setCount(`(${TOTAL} − ${GAP}) ÷ 2 = <b>${KID}</b>`);
      paint({ mode: 'cut', t: 1, line: KID, sum: `${TOTAL} − ${GAP}`, vals: [KID] });
      bump(nameA.querySelector('small'));
      await sleep(1300);
      if (cancelled(id)) return;
    }
  },
  {
    title: '第 2 问 · 和倍',
    async play(id) {
      setAsk('第 2 问 · 和倍', `一共 ${TOTAL} 颗，哥哥是弟弟的 ${TIMES} 倍`);
      paint({ mode: 'plain', sum: `一共 ${TOTAL}` });
      say('和倍', `「${TIMES} 倍」就是把哥哥切成 <b>${TIMES} 段</b>，每段都和弟弟一样长。`);
      await sleep(900);
      if (cancelled(id)) return;
      paint({ mode: 'parts', sum: `一共 ${TOTAL}` });
      await sleep(700);
      if (cancelled(id)) return;
      const labels = [];
      let kidText = '';
      for (let i = 1; i <= TIMES + 1; i++) {
        if (i === 1) kidText = CIRCLED[i];
        else labels[i - 2] = CIRCLED[i];
        paint({ mode: 'parts', sum: `一共 ${TOTAL}`, labels, kidText });
        pop(`${i}`);
        await sleep(450);
        if (cancelled(id)) return;
      }
      say('和倍', `弟弟 1 份，哥哥 ${TIMES} 份，一共 ${TIMES} + 1 = <b>${TIMES + 1} 份</b>。弟弟那 1 份别忘了数。`);
      setCount(`${TOTAL} ÷ (${TIMES} + 1) = <b>${KID}</b>`);
      paint({ mode: 'parts', sum: `${TIMES + 1} 份`, labels, kidText, vals: [KID] });
      bump(nameA.querySelector('small'));
      await sleep(1300);
      if (cancelled(id)) return;
    }
  },
  {
    title: '第 3 问 · 差倍',
    async play(id) {
      setAsk('第 3 问 · 差倍', `哥哥比弟弟多 ${GAP} 颗，哥哥是弟弟的 ${TIMES} 倍`);
      paint({ mode: 'parts', line: KID });
      say('差倍', `这回不知道一共，只知道<b>多出来的一截</b>是 ${GAP}。它是几份？只数竖线右边的。`);
      await sleep(1100);
      if (cancelled(id)) return;
      const labels = ['', '', ''];
      for (let i = 1; i < TIMES; i++) {
        labels[i] = CIRCLED[i];
        paint({ mode: 'parts', line: KID, dimFirst: true, labels, kidText: '' });
        pop(`${i}`);
        await sleep(500);
        if (cancelled(id)) return;
      }
      say('差倍', `多出来的是 ${TIMES} − 1 = <b>${TIMES - 1} 份</b>。和倍 +1 是把弟弟也数上，差倍 −1 是只数多出来的。`);
      setCount(`${GAP} ÷ (${TIMES} − 1) = <b>${KID}</b>`);
      paint({ mode: 'parts', line: KID, dimFirst: true, labels, vals: [KID] });
      bump(nameA.querySelector('small'));
      await sleep(1400);
      if (cancelled(id)) return;
    }
  },
  {
    title: '第 4 问 · 移多补少',
    async play(id) {
      setAsk('第 4 问 · 移多补少', '哥哥给弟弟几颗，两人一样多？');
      paint({ mode: 'gap', line: KID, gapText: `多 ${GAP}`, vals: [KID, BIG] });
      say('移多补少', '多出来的一截<b>劈成两半</b>：一半留给自己，一半送给弟弟。');
      await sleep(1100);
      if (cancelled(id)) return;
      paint({ mode: 'move', t: 0, line: KID, vals: [KID, BIG] });
      await sleep(500);
      if (cancelled(id)) return;
      await tween(1300, id, (e) =>
        paint({ mode: 'move', t: e, line: KID, vals: [KID + GIVE * e, BIG - GIVE * e] }));
      if (cancelled(id)) return;
      paint({ mode: 'move', t: 1, line: KID + GIVE, vals: [KID + GIVE, BIG - GIVE] });
      pop('一样长了');
      say('移多补少', `两人都是 ${KID + GIVE} 颗。送过去的只是<b>半截</b>，不是整截。`);
      setCount(`${GAP} ÷ 2 = <b>${GIVE}</b>`);
      await sleep(1400);
      if (cancelled(id)) return;
    }
  },
  {
    title: '第 5 问 · 一起长',
    async play(id) {
      setAsk('第 5 问 · 一起长', `妈妈给两人各发一样多，发几颗后哥哥是弟弟的 ${TIMES2} 倍？`);
      paint({ mode: 'gap', line: KID, gapText: `多 ${GAP}`, vals: [KID, BIG] });
      say('一起长', '两人<b>各加一样多</b>，绿色是新发的。盯住橙色那一截——');
      await sleep(1000);
      if (cancelled(id)) return;
      await tween(2400, id, (e) => {
        const g = ADD * e;
        paint({ mode: 'gap', g, line: KID + g, gapText: `多 ${GAP}`, vals: [KID + g, BIG + g] });
      });
      if (cancelled(id)) return;
      pop('那一截不变');
      await sleep(900);
      if (cancelled(id)) return;
      paint({ mode: 'gap', g: ADD, line: KID + ADD, gapText: `${GAP}＝又一个弟弟`, vals: [KID + ADD, BIG + ADD] });
      say('一起长', `那一截还是 ${GAP}，现在正好和弟弟一样长，哥哥是弟弟的 <b>${TIMES2} 倍</b>。换成年龄就是：${ADD} 年后爸爸是儿子的 ${TIMES2} 倍。`);
      setCount(`弟弟要到 ${GAP}，各发 ${GAP} − ${KID} = <b>${ADD}</b>`);
      await sleep(1500);
      if (cancelled(id)) return;
    }
  },
  {
    title: '答案都是 14',
    async play(id) {
      setAsk('一张图', `哥哥 ${BIG} 颗，弟弟 ${KID} 颗`);
      paint({ mode: 'gap', line: KID, gapText: `多 ${GAP}`, vals: [KID, BIG] });
      say('答案', '回到原来的图，把五道题的答案排一排——');
      for (let n = 1; n <= RECAP.length; n++) {
        showRecap(n);
        await sleep(450);
        if (cancelled(id)) return;
      }
      say('答案', `五道题答案<b>都是 ${KID}</b>，因为它们是<b>同一张图</b>。先画两根条子，再问：多出来的那一截是什么？`);
      pop(`都是 ${KID}`);
      await sleep(1500);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
