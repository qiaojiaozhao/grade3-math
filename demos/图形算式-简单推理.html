<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图形算式 · 动态演示</title>
<meta name="description" content="两个算式摆一起，划掉一样多的。减完两种都还剩 1 个不是白减——剩下的 ○ + △ = 22 就是钥匙。">
<link rel="stylesheet" href="lib/anim.css">
<style>
  :root {
    --circ: #f4a025;
    --circ-deep: #d48410;
    --tri: #2a9d8f;
    --tri-deep: #1d7a70;
  }

  .board {
    position: absolute;
    left: 36px; right: 36px; top: 118px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .eq {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 78px;
    padding: 8px 14px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0001;
    transition: opacity .4s, transform .4s;
  }
  .eq.dim { opacity: .22; }
  .eq.gone { opacity: 0; pointer-events: none; }

  .eq-no {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #e8f1fb;
    color: #2c6fb3;
    font-weight: 800;
    font-size: 18px;
    display: grid; place-items: center;
  }

  .tokens {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 62px;
  }

  .token {
    position: relative;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    animation: breathe 2.6s ease-in-out infinite;
    transition: opacity .35s, transform .35s;
  }
  .token:nth-child(2) { animation-delay: .2s; }
  .token:nth-child(3) { animation-delay: .4s; }
  .token:nth-child(4) { animation-delay: .15s; }
  .token:nth-child(5) { animation-delay: .35s; }
  .token:nth-child(6) { animation-delay: .55s; }
  .token:nth-child(7) { animation-delay: .25s; }

  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .circ {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffd27a, var(--circ) 55%, var(--circ-deep));
    box-shadow: 0 2px 0 var(--circ-deep);
  }
  .tri {
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 32px solid var(--tri);
    filter: drop-shadow(0 2px 0 var(--tri-deep));
  }

  .token.out { opacity: .22; animation: none; }
  .token.out::after {
    content: '';
    position: absolute;
    left: 4px; right: 4px; top: 50%;
    height: 3px;
    background: #c0392b;
    border-radius: 2px;
    transform: rotate(-28deg);
  }
  .token.keep {
    animation: none;
    transform: scale(1.08);
  }
  .token.keep::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 12px;
    border: 2px solid #e0662c;
    box-shadow: 0 0 0 4px #e0662c22;
  }
  .token.bump { animation: bump .45s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  .eq-eq {
    flex: none;
    font-size: 26px;
    font-weight: 800;
    color: #8aa0b3;
  }
  .eq-num {
    flex: none;
    min-width: 56px;
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #1f5f9e;
    transition: color .3s, transform .3s;
  }
  .eq-num.ghost { opacity: .28; }
  .eq-num.hot {
    color: #e0662c;
    transform: scale(1.15);
  }

  .pack {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 8px;
    border: 2px dashed #2c6fb3;
    border-radius: 14px;
    background: #e7f1fb;
    position: relative;
  }
  .pack .token { animation: none; }
  .pack-lab {
    position: absolute;
    left: 50%; bottom: -18px;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 800;
    color: #2c6fb3;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
  }
  .pack.show-lab { margin-bottom: 8px; }
  .pack.show-lab .pack-lab { opacity: 1; }

  .key {
    position: absolute;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    min-width: 280px;
    text-align: center;
    padding: 10px 22px;
    background: #fff6d8;
    border: 2px solid #e0a010;
    border-radius: 16px;
    font-size: 24px;
    font-weight: 800;
    color: #8a5a10;
    box-shadow: 0 6px 16px #e0a01033;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s, transform .35s;
  }
  .key.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .key b { color: #e0662c; }

  .answer {
    position: absolute;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    min-width: 300px;
    text-align: center;
    padding: 12px 24px;
    background: #e8f6ee;
    border: 2px solid #2f7a5b;
    border-radius: 16px;
    font-size: 26px;
    font-weight: 800;
    color: #1f5a3d;
    box-shadow: 0 6px 16px #2f7a5b33;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s, transform .35s;
  }
  .answer.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<h1>图形算式：划掉一样多的，剩下的就是钥匙</h1>
<div class="problem">
  ① ○ + ○ + ○ + △ + △ = <b>54</b>
  &nbsp;&nbsp;
  ② ○ + ○ + ○ + ○ + △ + △ + △ = <b>76</b>
  &nbsp;&nbsp;△ 和 ○ 各是多少？
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="board" id="board">
      <div class="eq" id="eq1">
        <span class="eq-no">①</span>
        <div class="tokens" id="tok1"></div>
        <span class="eq-eq">=</span>
        <span class="eq-num" id="num1">54</span>
      </div>
      <div class="eq" id="eq2">
        <span class="eq-no">②</span>
        <div class="tokens" id="tok2"></div>
        <span class="eq-eq">=</span>
        <span class="eq-num" id="num2">76</span>
      </div>
    </div>
    <div class="key" id="key">○ + △ = <b>22</b></div>
    <div class="answer" id="answer">△ = 12　○ = 10</div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script>
const { sleep, cancelled, say, pop } = Anim;

const ROW1 = ['o', 'o', 'o', 't', 't'];
const ROW2 = ['o', 'o', 'o', 'o', 't', 't', 't'];

function makeToken(kind) {
  const el = document.createElement('div');
  el.className = 'token';
  el.dataset.kind = kind;
  const inner = document.createElement('i');
  inner.className = kind === 'o' ? 'circ' : 'tri';
  el.appendChild(inner);
  return el;
}

function fill(box, kinds) {
  box.innerHTML = '';
  kinds.forEach((k) => box.appendChild(makeToken(k)));
}

function tokensOf(box, kind) {
  return [...box.querySelectorAll('.token')].filter((el) => el.dataset.kind === kind);
}

function bump(el) {
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function resetVisuals() {
  const eq1 = document.getElementById('eq1');
  const eq2 = document.getElementById('eq2');
  const tok1 = document.getElementById('tok1');
  const tok2 = document.getElementById('tok2');
  const num1 = document.getElementById('num1');
  const num2 = document.getElementById('num2');
  eq1.className = 'eq';
  eq2.className = 'eq';
  fill(tok1, ROW1);
  fill(tok2, ROW2);
  num1.textContent = '54';
  num1.className = 'eq-num ghost';
  num2.textContent = '76';
  num2.className = 'eq-num ghost';
  document.getElementById('key').classList.remove('show');
  document.getElementById('answer').classList.remove('show');
}

async function strikePair(a, b, id) {
  a.classList.add('out');
  b.classList.add('out');
  await sleep(220);
  if (cancelled(id)) return;
}

function strikeAll(box, keepO, keepT) {
  const os = tokensOf(box, 'o');
  const ts = tokensOf(box, 't');
  os.forEach((el, i) => {
    if (i < os.length - keepO) el.classList.add('out');
    else el.classList.add('keep');
  });
  ts.forEach((el, i) => {
    if (i < ts.length - keepT) el.classList.add('out');
    else el.classList.add('keep');
  });
}

function groupPacks(box) {
  const os = tokensOf(box, 'o');
  const ts = tokensOf(box, 't');
  box.innerHTML = '';
  for (let i = 0; i < 2; i++) {
    const pack = document.createElement('div');
    pack.className = 'pack';
    pack.appendChild(os[i]);
    pack.appendChild(ts[i]);
    const lab = document.createElement('span');
    lab.className = 'pack-lab';
    lab.textContent = '22';
    pack.appendChild(lab);
    box.appendChild(pack);
  }
  box.appendChild(os[2]);
}

Anim.run([
  {
    title: '先看图形',
    async play(id) {
      say('原来', '先<b>不猜是几</b>，只看：上面一排圆多，还是三角多？');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '数一数',
    async play(id) {
      document.getElementById('num1').classList.remove('ghost');
      document.getElementById('num2').classList.remove('ghost');
      say('数一数', '① 是 <b>3 个圆、2 个三角</b>。② 比它多 1 个圆、多 1 个三角。');
      const tok1 = document.getElementById('tok1');
      const tok2 = document.getElementById('tok2');
      for (const el of tok1.querySelectorAll('.token')) bump(el);
      await sleep(700);
      if (cancelled(id)) return;
      for (const el of tok2.querySelectorAll('.token')) bump(el);
      await sleep(600);
      if (cancelled(id)) return;
    }
  },
  {
    title: '划掉一样多的',
    async play(id) {
      document.getElementById('num1').classList.remove('ghost');
      document.getElementById('num2').classList.remove('ghost');
      say('划掉', '两边<b>一样多</b>的，一对一对划掉。左边划掉，右边也要跟着减。');
      const tok1 = document.getElementById('tok1');
      const tok2 = document.getElementById('tok2');
      const o1 = tokensOf(tok1, 'o');
      const o2 = tokensOf(tok2, 'o');
      const t1 = tokensOf(tok1, 't');
      const t2 = tokensOf(tok2, 't');

      for (let i = 0; i < 3; i++) {
        await strikePair(o1[i], o2[i], id);
        if (cancelled(id)) return;
      }
      pop('圆划掉 3 个');
      await sleep(500);
      if (cancelled(id)) return;

      for (let i = 0; i < 2; i++) {
        await strikePair(t1[i], t2[i], id);
        if (cancelled(id)) return;
      }
      pop('三角划掉 2 个');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
  {
    title: '剩下的就是钥匙',
    async play(id) {
      document.getElementById('num1').classList.remove('ghost');
      document.getElementById('num2').classList.remove('ghost');
      strikeAll(document.getElementById('tok1'), 0, 0);
      strikeAll(document.getElementById('tok2'), 1, 1);
      document.getElementById('eq1').classList.add('dim');

      const num2 = document.getElementById('num2');
      say('钥匙', '两种都还剩 1 个——<b>这不是白减</b>。76 − 54 = 22，剩下的就是 ○ + △。');
      await sleep(700);
      if (cancelled(id)) return;

      num2.textContent = '22';
      num2.classList.add('hot');
      bump(num2);
      document.getElementById('key').classList.add('show');
      pop('没消光也没关系！');
      await sleep(600);
      if (cancelled(id)) return;
    }
  },
  {
    title: '凑出整包',
    async play(id) {
      document.getElementById('eq2').classList.add('gone');
      document.getElementById('num1').classList.remove('ghost');
      document.getElementById('key').classList.add('show');
      const tok1 = document.getElementById('tok1');
      groupPacks(tok1);
      say('分组', '回到 ①：一个圆配一个三角，正好<b>两包</b>，多出一个圆。');
      await sleep(800);
      if (cancelled(id)) return;
      pop('两包 + 一个圆');
    }
  },
  {
    title: '整包换成 22',
    async play(id) {
      document.getElementById('eq2').classList.add('gone');
      document.getElementById('num1').classList.remove('ghost');
      document.getElementById('key').classList.add('show');
      const tok1 = document.getElementById('tok1');
      groupPacks(tok1);
      tok1.querySelectorAll('.pack').forEach((p) => p.classList.add('show-lab'));
      say('换掉', '每一包都是 <b>22</b>。两包 44，加上多出的那个圆，等于 54。');
      await sleep(800);
      if (cancelled(id)) return;
      const leftover = tok1.querySelector(':scope > .token');
      leftover.classList.add('keep');
      document.getElementById('num1').classList.add('hot');
      pop('44 + ○ = 54，○ = 10');
      await sleep(500);
      if (cancelled(id)) return;
    }
  },
  {
    title: '两个都求出来',
    async play(id) {
      document.getElementById('eq2').classList.add('gone');
      document.getElementById('key').classList.remove('show');
      document.getElementById('num1').classList.remove('ghost');
      const tok1 = document.getElementById('tok1');
      groupPacks(tok1);
      tok1.querySelectorAll('.pack').forEach((p) => p.classList.add('show-lab'));
      const leftover = tok1.querySelector(':scope > .token');
      leftover.classList.add('keep');
      document.getElementById('num1').classList.add('hot');
      document.getElementById('answer').classList.add('show');
      say('答案', '圆是 <b>10</b>，那三角就是 22 − 10 = <b>12</b>。△ = 12，○ = 10。');
      pop('△ = 12，○ = 10');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
