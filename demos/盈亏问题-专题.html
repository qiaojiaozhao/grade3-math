<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>盈亏问题 · 动态演示</title>
<meta name="description" content="买 3 本还剩 18 元，买 5 本还差 6 元。多买的 2 本，正好吃掉剩的、再差出一截。">
<link rel="stylesheet" href="lib/anim.css?v=portrait">
<style>
  html, body { background: #07080a; }
  .board {
    position: absolute;
    left: 36px; right: 36px;
    top: 168px; bottom: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  body.portrait .board { top: 210px; bottom: 36px; gap: 28px; }

  .lane {
    position: relative;
    height: 148px;
  }
  .moneyline {
    position: absolute;
    left: 0; bottom: 8px;
    height: 0;
    border-bottom: 3px dashed #8d97a3;
  }
  .moneyline::before {
    content: '';
    position: absolute;
    right: 0; bottom: 0;
    width: 3px;
    height: 14px;
    background: #8d97a3;
  }
  .moneyline span {
    position: absolute;
    right: 0; top: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #8d97a3;
    white-space: nowrap;
  }
  body.portrait .moneyline span { font-size: 18px; }

  .seg {
    position: absolute;
    bottom: 18px;
    height: 56px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
  }
  body.portrait .seg { height: 64px; font-size: 22px; }
  .seg .up {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 16px;
    font-weight: 800;
    color: #d5dbe3;
  }
  body.portrait .seg .up { font-size: 20px; top: -34px; }
  .seg.book { background: #2f6f4e; }
  .seg.left { background: #e0a106; color: #2a2410; }
  .seg.left .up { color: #e0a106; }
  .seg.short { background: #d9822b; }
  .seg.short .up { color: #ffb067; }
  .seg.mark {
    background: transparent;
    border: 3px solid #ff8a3d;
    color: #ffb067;
    height: 72px;
    bottom: 10px;
    z-index: 2;
  }
  body.portrait .seg.mark { height: 82px; }

  .formula {
    min-height: 44px;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #ffb347;
  }
  body.portrait .formula { font-size: 32px; }
  .formula b { color: #ff8a3d; }

  .kinds {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .kind {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1c1f26;
    border: 1px solid #2a2e36;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 20px;
    font-weight: 800;
    color: #e8eaed;
  }
  body.portrait .kind { font-size: 24px; padding: 16px 18px; }
  .kind i {
    flex: none;
    font-style: normal;
    background: #2f6f4e;
    color: #fff;
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 16px;
  }
  body.portrait .kind i { font-size: 18px; }
  .kind.on { border-color: #ff8a3d; }
</style>
</head>
<body class="theme-dark">

<h1>盈亏：每人多分的那一截</h1>
<div class="problem">
  买 <b>3</b> 本还剩 <b>18</b> 元，买 <b>5</b> 本还差 <b>6</b> 元。一本多少元？一共带了多少元？
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="board" id="board"></div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script>
const { sleep, cancelled, say, pop } = Anim;
const U = 14;
const board = document.getElementById('board');

function lane(parts, mark) {
  const box = document.createElement('div');
  box.className = 'lane';
  let x = 0;
  const nodes = [];
  for (const p of parts) {
    const el = document.createElement('div');
    el.className = 'seg ' + p.tone;
    const w = p.yuan * U;
    el.style.left = x + 'px';
    el.style.width = w + 'px';
    el.innerHTML = (p.up ? '<span class="up">' + p.up + '</span>' : '') + (p.text || '');
    box.appendChild(el);
    nodes.push({ el, x, w });
    x += w;
  }
  if (mark) {
    const line = document.createElement('div');
    line.className = 'moneyline';
    line.style.width = (mark.at * U) + 'px';
    line.innerHTML = '<span>' + mark.label + '</span>';
    box.appendChild(line);
  }
  box.style.width = x + 'px';
  box.style.marginLeft = 'auto';
  box.style.marginRight = 'auto';
  return { box, nodes, width: x };
}

function show(rows, formula) {
  board.innerHTML = '';
  for (const row of rows) board.appendChild(row);
  const f = document.createElement('div');
  f.className = 'formula';
  f.innerHTML = formula || '';
  board.appendChild(f);
}

function resetVisuals() {
  board.innerHTML = '';
}

Anim.run([
  {
    title: '买 3 本，还剩一截',
    async play(id) {
      const a = lane([
        { yuan: 36, tone: 'book', text: '3 本' },
        { yuan: 18, tone: 'left', up: '还剩', text: '18 元' },
      ]);
      show([a.box]);
      say('先看', '钱是一条线段。<b>3 本</b>占一段，右边还剩一截。');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '再买 2 本',
    async play(id) {
      const a = lane([
        { yuan: 36, tone: 'book', text: '3 本' },
        { yuan: 18, tone: 'left', up: '还剩', text: '18 元' },
      ]);
      const b = lane([
        { yuan: 36, tone: 'book', text: '' },
        { yuan: 18, tone: 'book', text: '' },
        { yuan: 6, tone: 'short', up: '还差', text: '6 元' },
      ]);
      b.nodes[0].el.textContent = '3 本';
      b.nodes[1].el.className = 'seg light';
      b.nodes[1].el.textContent = '18 元';
      const cover = document.createElement('div');
      cover.className = 'seg mark';
      cover.style.left = (36 * U) + 'px';
      cover.style.width = (24 * U) + 'px';
      cover.innerHTML = '<span class="up">多买的 2 本</span>';
      b.box.appendChild(cover);
      show([a.box, b.box]);
      say('再买', '改成 <b>5 本</b>，多买的 2 本先吃掉剩下的 18 元，还不够，又差出 6 元。');
      await sleep(1100);
      if (cancelled(id)) return;
    }
  },
  {
    title: '2 本 = 18 + 6',
    async play(id) {
      const b = lane([
        { yuan: 36, tone: 'book', text: '3 本' },
        { yuan: 24, tone: 'book', up: '这 2 本', text: '18 + 6' },
      ]);
      show([b.box], '(18 + 6) ÷ 2 = <b>12 元</b>');
      say('一截', '多买的 <b>2 本</b>，正好等于剩的 18 加上差的 6。');
      await sleep(700);
      if (cancelled(id)) return;
      pop('一本 12 元');
      await sleep(500);
      if (cancelled(id)) return;
    }
  },
  {
    title: '一共 54 元',
    async play(id) {
      const a = lane([
        { yuan: 36, tone: 'book', text: '3 本' },
        { yuan: 18, tone: 'left', text: '18 元' },
      ], { at: 54, label: '54 元' });
      show([a.box], '3 × 12 + 18 = <b>54 元</b>');
      say('总数', '3 本是 36 元，再加上还剩的 18 元。带着 <b>54</b> 元。');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '两次都剩',
    async play(id) {
      const a = lane([
        { yuan: 12, tone: 'book', text: '每人 5 本' },
        { yuan: 9, tone: 'left', text: '12 本' },
        { yuan: 5, tone: 'left', text: '2 本' },
      ]);
      a.nodes[1].el.style.padding = '0';
      a.nodes[2].el.style.padding = '0';
      a.nodes[2].el.style.boxShadow = 'inset 4px 0 0 #07080a';
      const b = lane([
        { yuan: 12, tone: 'book', text: '每人 5 本' },
        { yuan: 9, tone: 'short', text: '12 本' },
        { yuan: 5, tone: 'left', text: '2 本' },
      ]);
      b.nodes[1].el.style.padding = '0';
      b.nodes[2].el.style.padding = '0';
      show([a.box, b.box], '(14 − 2) ÷ 2 = <b>6 人</b>');
      say('两盈', '两次都在线段里面。14 本拆成还剩的 <b>2 本</b>，和挪走的 <b>12 本</b>。');
      await sleep(1100);
      if (cancelled(id)) return;
    }
  },
  {
    title: '两次都不够',
    async play(id) {
      const a = lane([
        { yuan: 12, tone: 'book', text: '有的花' },
        { yuan: 5, tone: 'short', text: '缺 1' },
        { yuan: 9, tone: 'short', text: '14 朵' },
      ]);
      a.nodes[1].el.style.padding = '0';
      a.nodes[2].el.style.padding = '0';
      a.nodes[2].el.style.boxShadow = 'inset 4px 0 0 #07080a';
      const b = lane([
        { yuan: 12, tone: 'book', text: '有的花' },
        { yuan: 5, tone: 'short', text: '缺 1' },
      ]);
      b.nodes[1].el.style.padding = '0';
      show([a.box, b.box], '(15 − 1) ÷ 2 = <b>7 瓶</b>');
      say('两亏', '两次都在线段外面。和下面一样的是缺 <b>1</b> 朵，多出来的 <b>14</b> 朵才是每瓶少插的。');
      await sleep(1100);
      if (cancelled(id)) return;
    }
  },
  {
    title: '都是那一截',
    async play(id) {
      board.innerHTML =
        '<div class="kinds">' +
        '<div class="kind on"><i>一盈一亏</i>剩的和差的加起来</div>' +
        '<div class="kind"><i>两盈</i>大剩减小剩</div>' +
        '<div class="kind"><i>两亏</i>大缺减小缺</div>' +
        '</div>' +
        '<div class="formula">再除以每人相差几 = <b>人数</b></div>';
      say('一句', '先看两次是剩还是不够。一剩一不够就<b>相加</b>，两次一样就<b>相减</b>。');
      await sleep(1000);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
