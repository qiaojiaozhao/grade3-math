<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>点和段 · 动态演示</title>
<meta name="description" content="系统课。同一条 20 米的路，两端都种、一端有房子、两端都不种、围成一圈，树比段多 1、一样多、少 1、一样多。爬楼梯、敲钟也是在数点和段。">
<link rel="stylesheet" href="lib/anim.css?v=portrait">
<style>
  html, body { background: #07080a; }

  .stage {
    --k: .56;
    --askTop: 92px;
    --boardTop: 200px;
    --countTop: 400px;
    --fs: 13px;
  }
  body.portrait .stage {
    --k: 1;
    --askTop: 290px;
    --boardTop: 640px;
    --countTop: 1180px;
    --fs: 28px;
  }

  .ask {
    position: absolute;
    left: 50%; top: var(--askTop);
    transform: translateX(-50%);
    width: 88%;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
    font-size: 15px; font-weight: 800; line-height: 1.5;
    color: #e8eaed;
  }
  body.portrait .ask { font-size: 32px; gap: 18px; }
  .ask:empty { display: none; }
  .ask .no { background: #ff8a3d; color: #1a1208; border-radius: 999px; padding: 3px 12px; }
  body.portrait .ask .no { padding: 6px 24px; }
  .ask.pop { animation: bump-center .45s cubic-bezier(.2, 1.6, .3, 1); }

  .board {
    position: absolute;
    left: 50%; top: var(--boardTop);
    width: calc(820px * var(--k));
    height: calc(460px * var(--k));
    transform: translateX(-50%);
  }

  .el {
    position: absolute;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs); font-weight: 800;
    white-space: nowrap;
  }
  .el.pop { animation: squash .5s cubic-bezier(.2, 1.6, .3, 1); }

  .road { background: #4a4a52; border-radius: 6px; box-shadow: inset 0 3px 0 #5e5e68; }
  .road.dash { background: repeating-linear-gradient(90deg, #4a4a52 0 40px, #5e5e68 40px 56px); }
  .tick { border-left: 3px dashed #9aa3ad; }
  .tree { color: #5ecf8a; }
  .tree .top { width: 100%; height: 100%; border-radius: 50%; background: #5ecf8a; box-shadow: inset 0 -8px 0 #3da868; }
  .tree.ghost .top { background: transparent; border: 3px dashed #ff6b6b; box-shadow: none; }
  .no-tree { color: #ff6b6b; }
  .house { background: #e8c27a; border-radius: 4px 4px 0 0; color: #1a1208; }
  .segno { color: #e8c27a; }
  .treeno { color: #5ecf8a; }
  .lab { color: #e8c27a; }
  .red { color: #ff6b6b; }
  .green { color: #5ecf8a; }

  .pond { border: calc(14px * var(--k)) solid #4a4a52; border-radius: 50%; }
  .floor { background: #6ea8ff; border-radius: 4px; color: #0b1a33; }
  .stair { border-top: 3px dashed #ffb347; }
  .bell { background: #ffb347; border-radius: 50% 50% 8px 8px; color: #1a1208; }
  .gap { border-bottom: 3px solid #e8c27a; color: #e8c27a; align-items: flex-end; }

  .count {
    position: absolute;
    left: 0; right: 0; top: var(--countTop);
    text-align: center;
    font-size: 21px; font-weight: 800; line-height: 1.55;
    color: #ffb347;
  }
  body.portrait .count { font-size: 42px; }
  .count b { color: #5ecf8a; }
  .count .no { color: #ff6b6b; text-decoration: line-through; }
  .count.pop { animation: bump .45s cubic-bezier(.2, 1.6, .3, 1); }

  .recap {
    position: absolute;
    left: 50%; top: calc(var(--countTop) - 60px);
    transform: translateX(-50%);
    display: none;
    grid-template-columns: auto auto auto;
    gap: 4px 18px;
    font-size: 15px; font-weight: 800;
    white-space: nowrap;
  }
  body.portrait .recap { top: calc(var(--countTop) - 130px); font-size: 32px; gap: 20px 26px; }
  .recap.on { display: grid; }
  .recap .k { color: #e8c27a; text-align: right; }
  .recap .m { color: #ffb347; }
  .recap .v { color: #f4f6f8; }
  .recap .v b { color: #5ecf8a; }
  .recap .hide { visibility: hidden; }

  @keyframes squash {
    0% { transform: scale(1.3, .6); }
    55% { transform: scale(.9, 1.15); }
    100% { transform: scale(1, 1); }
  }
  @keyframes bump {
    0% { transform: scale(.75); }
    55% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes bump-center {
    0% { transform: translateX(-50%) scale(.75); }
    55% { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body class="theme-dark">

<h1>点和段：先问哪个是点、哪个是段，再问两头算不算</h1>
<div class="problem">
  同一条 20 米的路，每隔 5 米种一棵树。两端都种、一端有房子、两端都不种、围成一圈，<b>段都是 4</b>，树却是 5、4、3、4 棵。爬楼梯、敲钟，也是在数点和段。
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="ask" id="ask"></div>
    <div class="board" id="board"></div>
    <div class="count" id="count"></div>
    <div class="recap" id="recap"></div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script>
const { cancelled, say } = Anim;
const SLOW = 2;
const sleep = ms => Anim.sleep(ms * SLOW);

const ROAD_M = 20, EVERY = 5;
const SEGS = ROAD_M / EVERY;           // 4
const FLOOR_FROM = 1, FLOOR_TO = 5, FLOOR_SEC = 48;
const BELLS = 6, BELL_SEC = 10;

const board = document.getElementById('board');
const ask = document.getElementById('ask');
const countEl = document.getElementById('count');
const recap = document.getElementById('recap');

/* 坐标都按竖版像素写，横版乘 --k */
const px = (v) => `calc(${v}px * var(--k))`;
function el(x, y, w, h, cls, html = '') {
  return `<div class="el ${cls}" style="left:${px(x)};top:${px(y)};width:${px(w)};height:${px(h)}">${html}</div>`;
}
function draw(parts) { board.innerHTML = parts.join(''); }
function bump(e) { e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }
function setAsk(no, text) { ask.innerHTML = `<span class="no">${no}</span><span>${text}</span>`; bump(ask); }
function setCount(html) { countEl.innerHTML = html; bump(countEl); }

/* 一条路 720 长，4 段。trees 是哪些点上有树（0..SEGS），fresh 是刚种的那棵弹一下 */
const RX = 50, RW = 720, SEG = RW / SEGS, RY = 250;
function road({ trees = [], fresh = -1, segnos = true, houses = [], ghost = [], labels = true } = {}) {
  const out = [el(RX, RY, RW, 40, 'road')];
  for (let i = 1; i < SEGS; i++) out.push(el(RX + SEG * i - 1, RY, 3, 40, 'tick'));
  if (segnos) for (let i = 0; i < SEGS; i++) out.push(el(RX + SEG * i, RY + 50, SEG, 40, 'segno', `${EVERY} 米`));
  for (const i of trees) {
    const x = RX + SEG * i;
    out.push(el(x - 28, RY - 90, 56, 56, 'tree' + (i === fresh ? ' pop' : ''), '<div class="top"></div>'));
    out.push(el(x - 4, RY - 40, 8, 40, 'road'));
    if (labels) out.push(el(x - 30, RY - 140, 60, 40, 'treeno', `${trees.indexOf(i) + 1}`));
  }
  for (const i of ghost) {
    const x = RX + SEG * i;
    out.push(el(x - 28, RY - 90, 56, 56, 'tree ghost pop', '<div class="top"></div>'));
    out.push(el(x - 40, RY - 140, 80, 40, 'no-tree', '不种'));
  }
  for (const h of houses) {
    const x = RX + SEG * h;
    out.push(el(x - 40, RY - 100, 80, 100, 'house pop', '房子'));
  }
  return out;
}

/* 围成一圈：周长 20 米画成直径 300 的圆，4 棵树在四个方向 */
const CX = 410, CY = 240, R = 150;
function pond({ trees = 0, fresh = -1 } = {}) {
  const out = [el(CX - R, CY - R, R * 2, R * 2, 'pond')];
  for (let i = 0; i < SEGS; i++) {
    const a = -Math.PI / 2 + (i / SEGS) * Math.PI * 2;
    const am = a + Math.PI / SEGS;
    out.push(el(CX + Math.cos(am) * (R - 60) - 40, CY + Math.sin(am) * (R - 60) - 20, 80, 40, 'segno', `${EVERY} 米`));
    if (i < trees) {
      const x = CX + Math.cos(a) * R, y = CY + Math.sin(a) * R;
      out.push(el(x - 28, y - 28, 56, 56, 'tree' + (i === fresh ? ' pop' : ''), '<div class="top"></div>'));
      out.push(el(x + (Math.cos(a) * 60) - 30, y + (Math.sin(a) * 60) - 20, 60, 40, 'treeno', `${i + 1}`));
    }
  }
  return out;
}

/* 爬楼梯：楼层是点（蓝块），层与层之间是段（虚线） */
function floors(upto = FLOOR_TO, showGaps = false) {
  const out = [];
  const H = 70, GAP = 20, BASE = 420;
  for (let f = 1; f <= upto; f++) {
    const y = BASE - (f - 1) * (H + GAP) - H;
    out.push(el(240, y, 160, H, 'floor', `${f} 楼`));
    if (showGaps && f < upto) out.push(el(420, y - GAP, 220, GAP, 'stair lab', `第 ${f} 层`));
  }
  return out;
}

/* 敲钟：钟声是点（橙钟），两声之间是段 */
function bells(n = BELLS, gaps = false) {
  const out = [];
  const W = 60, STEP = 120, X0 = 110, Y = 200;
  for (let i = 0; i < n; i++) {
    out.push(el(X0 + i * STEP, Y, W, 70, 'bell', `${i + 1}`));
    if (gaps && i < n - 1) out.push(el(X0 + W + i * STEP, Y + 90, STEP - W, 40, 'gap', `${i + 1}`));
  }
  return out;
}

const RECAP = [
  ['两端都种', `${SEGS} 段 → 点多 1`, `${SEGS} + 1 = <b>5 棵</b>`],
  ['一端有房子', `${SEGS} 段 → 一样多`, `<b>4 棵</b>`],
  ['两端都不种', `${SEGS} 段 → 点少 1`, `${SEGS} − 1 = <b>3 棵</b>`],
  ['围成一圈', `${SEGS} 段 → 一样多`, `<b>4 棵</b>`],
];
function showRecap(n) {
  recap.innerHTML = RECAP.map((row, i) => {
    const hide = i < n ? '' : ' hide';
    return `<span class="k${hide}">${row[0]}</span><span class="m${hide}">${row[1]}</span><span class="v${hide}">${row[2]}</span>`;
  }).join('');
  recap.classList.add('on');
}

function resetVisuals() {
  board.innerHTML = '';
  ask.innerHTML = '';
  countEl.innerHTML = '';
  countEl.classList.remove('pop');
  recap.classList.remove('on');
}

const ASK_ROAD = `一条 ${ROAD_M} 米的路，每隔 ${EVERY} 米种一棵树。要种几棵？`;
const ASK_POND = `一个水池一周 ${ROAD_M} 米，每隔 ${EVERY} 米种一棵树。要种几棵？`;
const ASK_FLOOR = `从 ${FLOOR_FROM} 楼走到 ${FLOOR_TO} 楼要 ${FLOOR_SEC} 秒。走一层要几秒？`;
const ASK_BELL = `钟敲 ${BELLS} 下用了 ${BELL_SEC} 秒。两声之间隔几秒？`;
const ALL = [0, 1, 2, 3, 4];

Anim.run([
  {
    title: '先数段',
    async play(id) {
      setAsk('种树', ASK_ROAD);
      draw(road());
      say('先数段', `${ROAD_M} 米的路，每 ${EVERY} 米一段。先别数树，<b>先数段</b>。`);
      await sleep(1300);
      if (cancelled(id)) return;
      setCount(`${ROAD_M} ÷ ${EVERY} = <b>${SEGS} 段</b>`);
      say('先数段', `${SEGS} 段。四种种法，<b>段都是 ${SEGS}</b>，不一样的只是两头。`);
      await sleep(1500);
      if (cancelled(id)) return;
    }
  },
  {
    title: '两端都种：多 1',
    async play(id) {
      setAsk('两端都种', ASK_ROAD);
      draw(road());
      say('两端都种', '两头都种。树种在<b>点</b>上，一个点一棵。');
      await sleep(900);
      if (cancelled(id)) return;
      for (let i = 0; i <= SEGS; i++) {
        draw(road({ trees: ALL.slice(0, i + 1), fresh: i }));
        await sleep(420);
        if (cancelled(id)) return;
      }
      setCount(`${SEGS} 段，${SEGS} + 1 = <b>5 棵</b>`);
      say('多 1', `每一段配它右边的那棵树，${SEGS} 段配 ${SEGS} 棵。最左边那棵<b>没有段配</b>，多出来的就是它。点比段多 1。`);
      await sleep(2000);
      if (cancelled(id)) return;
    }
  },
  {
    title: '一端有房子：一样多',
    async play(id) {
      setAsk('一端有房子', ASK_ROAD + ' 路的一头是房子，房子那头不种。');
      draw(road({ trees: ALL, houses: [SEGS] }));
      await sleep(900);
      if (cancelled(id)) return;
      draw(road({ trees: ALL.slice(0, SEGS), houses: [SEGS], ghost: [SEGS] }));
      setCount(`<span class="no">${SEGS} + 1 = 5</span>　<b>4 棵</b>`);
      say('一样多', `右边那头被房子占了，少种一棵。${SEGS} 段，${SEGS} 棵，<b>点和段一样多</b>。`);
      await sleep(2000);
      if (cancelled(id)) return;
    }
  },
  {
    title: '两端都不种：少 1',
    async play(id) {
      setAsk('两端都不种', ASK_ROAD + ' 两头都是房子，都不种。');
      draw(road({ trees: ALL.slice(1, SEGS), houses: [0, SEGS], ghost: [0, SEGS] }));
      setCount(`${SEGS} 段，${SEGS} − 1 = <b>3 棵</b>`);
      say('少 1', `两头都不种，树只在<b>段和段之间</b>。${SEGS} 段中间只有 3 个缝，点比段少 1。锯木头的锯口就是这一种。`);
      await sleep(2200);
      if (cancelled(id)) return;
    }
  },
  {
    title: '围成一圈：又一样多',
    async play(id) {
      setAsk('围成一圈', ASK_POND);
      draw(pond());
      say('围成一圈', `一周 ${ROAD_M} 米，每 ${EVERY} 米一段，还是 ${SEGS} 段。`);
      await sleep(1100);
      if (cancelled(id)) return;
      for (let i = 1; i <= SEGS; i++) {
        draw(pond({ trees: i, fresh: i - 1 }));
        await sleep(420);
        if (cancelled(id)) return;
      }
      setCount(`<span class="no">${SEGS} + 1 = 5</span>　${SEGS} 段，<b>4 棵</b>`);
      say('一样多', `把直路弯成圈，最后一段<b>接回第一棵树</b>，头和尾是同一个点。每段配一棵，<b>点和段一样多</b>。`);
      await sleep(2200);
      if (cancelled(id)) return;
    }
  },
  {
    title: '爬楼梯：楼层是点',
    async play(id) {
      setAsk('爬楼梯', ASK_FLOOR);
      draw(floors());
      say('哪个是点', `先问：哪个是点、哪个是段？<b>楼层是点</b>，楼梯在两层之间，是段。`);
      await sleep(1400);
      if (cancelled(id)) return;
      draw(floors(FLOOR_TO, true));
      setCount(`${FLOOR_TO} 层楼，走 ${FLOOR_TO - FLOOR_FROM} 层。${FLOOR_SEC} ÷ ${FLOOR_TO - FLOOR_FROM} = <b>12 秒</b>`);
      say('楼层是点', `1 楼到 ${FLOOR_TO} 楼，${FLOOR_TO} 个点，中间只有 ${FLOOR_TO - FLOOR_FROM} 段。时间花在段上，不是 ${FLOOR_SEC} ÷ ${FLOOR_TO}。`);
      await sleep(2200);
      if (cancelled(id)) return;
    }
  },
  {
    title: '敲钟：钟声是点',
    async play(id) {
      setAsk('敲钟', ASK_BELL);
      draw(bells());
      say('哪个是点', `<b>钟声是点</b>，两声之间的安静是段。${BELLS} 下敲完，中间几段？`);
      await sleep(1400);
      if (cancelled(id)) return;
      draw(bells(BELLS, true));
      setCount(`${BELLS} 下，${BELLS - 1} 个间隔。${BELL_SEC} ÷ ${BELLS - 1} = <b>2 秒</b>`);
      say('钟声是点', `${BELLS} 个点，${BELLS - 1} 段。时间花在段上，一个间隔 2 秒。敲 12 下有 11 个间隔，22 秒。`);
      await sleep(2200);
      if (cancelled(id)) return;
    }
  },
  {
    title: '一根骨头',
    async play(id) {
      setAsk('点和段', '先问哪个是点、哪个是段，再问两头算不算');
      draw(road({ trees: ALL, segnos: false, labels: false }));
      say('对一对', '四种种法排一排——段都是 4——');
      for (let n = 1; n <= RECAP.length; n++) {
        showRecap(n);
        await sleep(600);
        if (cancelled(id)) return;
      }
      say('答案', `两头都算，点多 1；算一头，一样多；两头都不算，点少 1；围成圈，接回头，一样多。爬楼梯、敲钟、锯木头，都先问<b>哪个是点</b>。`);
      await sleep(2200);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
