<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联欢会握手 · 动态演示</title>
<meta name="description" content="先用手从 7 点到 10：减完是空档，两头的人还在。这道题从 7 点到男生，女生少 6 个，再用和差收口。">
<link rel="stylesheet" href="lib/anim.css">
<link rel="stylesheet" href="lib/bars.css">
<style>
  :root {
    --boy: #3d8bd8;
    --boy-deep: #1f5f9e;
    --girl: #e36b8a;
    --girl-deep: #b43d5c;
  }

  .scene-box {
    position: absolute;
    left: 36px; right: 36px; top: 118px;
    bottom: 24px;
  }
  .scene-box.gone { display: none; }

  .pair {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 86px;
    padding: 10px 16px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0001;
  }
  .who {
    flex: none;
    width: 92px;
    font-size: 15px;
    font-weight: 800;
    color: var(--girl-deep);
    line-height: 1.3;
  }
  .hands {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-height: 58px;
  }
  .n {
    flex: none;
    min-width: 48px;
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #1f5f9e;
  }
  .n.hot { color: #e0662c; }
  .n.ghost { opacity: .3; }

  .person {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 34px;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .person:nth-child(2) { animation-delay: .2s; }
  .person:nth-child(3) { animation-delay: .4s; }
  .person:nth-child(4) { animation-delay: .15s; }
  .person:nth-child(5) { animation-delay: .35s; }
  .person:nth-child(6) { animation-delay: .5s; }
  .person:nth-child(7) { animation-delay: .25s; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .head {
    width: 20px; height: 20px;
    border-radius: 50%;
    z-index: 1;
  }
  .body {
    width: 16px; height: 20px;
    margin-top: -3px;
    border-radius: 7px 7px 5px 5px;
  }
  .person.boy .head {
    background: radial-gradient(circle at 32% 28%, #8ec6f5, var(--boy) 60%, var(--boy-deep));
  }
  .person.boy .body { background: var(--boy-deep); }
  .person.girl .head {
    background: radial-gradient(circle at 32% 28%, #f7b3c4, var(--girl) 60%, var(--girl-deep));
  }
  .person.girl .body { background: var(--girl-deep); }
  .person.ghost { opacity: .22; animation: none; }
  .person.on {
    animation: none;
    filter: drop-shadow(0 0 0 3px #e0662c55);
    transform: scale(1.12);
  }
  .person .badge {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 800;
    color: var(--girl-deep);
    line-height: 1;
  }

  .more {
    align-self: center;
    color: #8aa0b3;
    font-weight: 800;
    font-size: 16px;
    padding-bottom: 10px;
  }

  .stepper {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    padding-top: 112px;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 72px;
  }
  .step .person { width: 44px; animation: none; }
  .step .head { width: 26px; height: 26px; }
  .step .body { width: 20px; height: 24px; }
  .step .badge {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 800;
    color: #1f5f9e;
    min-height: 26px;
  }
  .step.lit .badge { color: #e0662c; transform: scale(1.15); }
  .step.lit .person { transform: scale(1.08); }
  .step.dots {
    width: 54px;
    padding-bottom: 28px;
    font-size: 22px;
    font-weight: 800;
    color: #8aa0b3;
    letter-spacing: 2px;
  }

  .bridge {
    width: 56px;
    align-self: center;
    margin-bottom: 36px;
    text-align: center;
  }
  .bridge .line {
    height: 4px;
    background: #d7e0e8;
    border-radius: 2px;
  }
  .bridge .lab {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #c05621;
    opacity: 0;
  }
  .bridge.show .line { background: #e0a010; }
  .bridge.show .lab { opacity: 1; }

  .note {
    margin-top: 22px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #8a5a10;
    min-height: 32px;
  }
  .note b { color: #e0662c; }

  .answer {
    position: absolute;
    left: 50%; bottom: 20px;
    transform: translateX(-50%);
    min-width: 280px;
    text-align: center;
    padding: 12px 24px;
    background: #e8f6ee;
    border: 2px solid #2f7a5b;
    border-radius: 16px;
    font-size: 26px;
    font-weight: 800;
    color: #1f5a3d;
    box-shadow: 0 6px 16px #2f7a5b33;
    opacity: 0;
    pointer-events: none;
  }
  .answer.show { opacity: 1; }

  .bar-box {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .bar-box.show { opacity: 1; }
</style>
</head>
<body>

<h1>联欢会握手：点过去，头和尾都要点</h1>
<div class="problem">
  50 人联欢。第一个女生和<b>全部男生</b>握手，下一个少 1 个，最后那个只握了 <b>7</b> 个。男生多少人？
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="scene-box" id="boxHands">
      <div class="pair">
        <div class="card" id="cardFirst">
          <div class="who">第 1 个<br>女生</div>
          <div class="hands" id="handsFirst"></div>
          <div class="n ghost" id="nFirst">?</div>
        </div>
        <div class="card" id="cardLast">
          <div class="who">最后 1 个<br>女生</div>
          <div class="hands" id="handsLast"></div>
          <div class="n" id="nLast">7</div>
        </div>
      </div>
    </div>

    <div class="scene-box gone" id="boxCount">
      <div class="stepper" id="stepper"></div>
      <div class="note" id="note"></div>
    </div>

    <div class="bar-box" id="barBox"></div>
    <div class="answer" id="answer">男生 28 人</div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script src="lib/bars.js"></script>
<script>
const { sleep, cancelled, say, pop } = Anim;

const bars = Bars.create({
  stage: document.getElementById('barBox'),
  items: [
    { name: '男生', color: '#3d8bd8' },
    { name: '女生', color: '#e36b8a' },
  ],
  scale: 9,
  unit: ' 人',
  padding: 170,
});

function person(kind, badge, extra) {
  const el = document.createElement('div');
  el.className = 'person ' + kind + (extra ? ' ' + extra : '');
  el.innerHTML = '<div class="head"></div><div class="body"></div>' +
    (badge != null ? '<div class="badge">' + badge + '</div>' : '');
  return el;
}

function fillBoys(box, n, ghosts) {
  box.innerHTML = '';
  for (let i = 0; i < n; i++) box.appendChild(person('boy'));
  if (ghosts) {
    const more = document.createElement('span');
    more.className = 'more';
    more.textContent = '还有';
    box.appendChild(more);
    for (let i = 0; i < ghosts; i++) box.appendChild(person('boy', null, 'ghost'));
  }
}

function addStep(box, lab) {
  const step = document.createElement('div');
  step.className = 'step';
  const kind = lab === '男生' ? 'boy' : 'girl';
  step.appendChild(person(kind, lab));
  box.appendChild(step);
}

function addBridge(box) {
  const br = document.createElement('div');
  br.className = 'bridge';
  br.innerHTML = '<div class="line"></div><div class="lab">空档</div>';
  box.appendChild(br);
}

function buildMini() {
  const box = document.getElementById('stepper');
  box.innerHTML = '';
  ['7', '8', '9', '10'].forEach((lab, i) => {
    if (i) addBridge(box);
    addStep(box, lab);
  });
}

function buildReal() {
  const box = document.getElementById('stepper');
  box.innerHTML = '';
  ['7', '8', '9'].forEach((lab, i) => {
    if (i) addBridge(box);
    addStep(box, lab);
  });
  const dots = document.createElement('div');
  dots.className = 'step dots';
  dots.textContent = '···';
  box.appendChild(dots);
  addStep(box, '男生');
}

function show(id) {
  document.getElementById('boxHands').classList.toggle('gone', id !== 'hands');
  document.getElementById('boxCount').classList.toggle('gone', id !== 'count');
  document.getElementById('barBox').classList.toggle('show', id === 'bars');
}

function resetVisuals() {
  fillBoys(document.getElementById('handsFirst'), 7, 4);
  fillBoys(document.getElementById('handsLast'), 7, 0);
  document.getElementById('nFirst').textContent = '?';
  document.getElementById('nFirst').className = 'n ghost';
  document.getElementById('nLast').textContent = '7';
  document.getElementById('nLast').className = 'n';
  document.getElementById('cardFirst').style.display = '';
  document.getElementById('cardFirst').style.opacity = '1';
  document.getElementById('note').textContent = '';
  document.getElementById('answer').classList.remove('show');
  show('hands');
  bars.reset();
  bars.set([0, 0]);
}

Anim.run([
  {
    title: '她只握了 7 个',
    async play(id) {
      document.getElementById('cardFirst').style.display = 'none';
      fillBoys(document.getElementById('handsFirst'), 0, 0);
      say('先看', '最后到的女生，只跟 <b>7</b> 个男生握过手。先别说男生就是 7 个。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '前面的握得更多',
    async play(id) {
      say('还有人', '第一个女生跟<b>全部男生</b>握过。所以男生比这 7 个多，多出来的还没数。');
      await sleep(700);
      if (cancelled(id)) return;
      pop('7 不是全部');
    }
  },
  {
    title: '先拿小数一遍',
    async play(id) {
      show('count');
      buildMini();
      say('用手点', '先不管 50。假如从 7 握到 10，我们<b>一个一个点</b>。');
      const steps = [...document.querySelectorAll('#stepper .step')];
      for (let i = 0; i < steps.length; i++) {
        steps.forEach((s) => s.classList.remove('lit'));
        steps[i].classList.add('lit');
        document.getElementById('note').innerHTML = '点到 <b>' + (i + 1) + '</b> 个人';
        await sleep(420);
        if (cancelled(id)) return;
      }
    }
  },
  {
    title: '减完是空档',
    async play(id) {
      show('count');
      buildMini();
      document.getElementById('note').innerHTML = '10 − 7 = <b>3</b>，是中间 3 段空档';
      say('空档', '10 减 7 得到 3——那是中间的<b>空档</b>。两头的人还站着，所以再加 1。');
      await sleep(500);
      if (cancelled(id)) return;
      document.querySelectorAll('#stepper .bridge').forEach((g) => g.classList.add('show'));
      await sleep(500);
      if (cancelled(id)) return;
      document.getElementById('note').innerHTML = '3 段空档 + 两头 = <b>4</b> 个人';
    }
  },
  {
    title: '这道题也一样',
    async play(id) {
      show('count');
      buildReal();
      document.getElementById('note').innerHTML = '男生 − 7 + 1 = 男生 − <b>6</b>';
      say('少 6 个', '真题也这样点：最后是 7，第一是全部男生。减完加 1，女生比男生<b>少 6 个</b>。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '一共 50，多 6',
    async play(id) {
      show('bars');
      bars.set([28, 22]);
      say('和差', '一共 <b>50</b> 人，男生比女生多 6。把多的 6 拿掉，剩下两份一样长。');
      await sleep(500);
      if (cancelled(id)) return;
      bars.diff(0, 1, '多 6');
      await sleep(600);
      if (cancelled(id)) return;
      bars.showNumbers(true);
    }
  },
  {
    title: '男生 28 人',
    async play(id) {
      show('bars');
      bars.set([28, 22]);
      bars.showNumbers(true);
      bars.diff(0, 1, '多 6');
      say('答案', '男生 <b>28</b> 人。从 28 点到 7，点了 22 个女生。28 + 22 = 50。');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
