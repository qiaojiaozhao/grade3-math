<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联欢会握手 · 动态演示</title>
<meta name="description" content="最后一个女生是第「女生人数」个，所以少握了「女生人数 − 1」个。男生 −（女生 − 1）= 7，挪一下就多 6。">
<link rel="stylesheet" href="lib/anim.css">
<link rel="stylesheet" href="lib/bars.css">
<style>
  :root {
    --boy: #3d8bd8;
    --boy-deep: #1f5f9e;
    --girl: #e36b8a;
    --girl-deep: #b43d5c;
  }

  .scene-box {
    position: absolute;
    left: 36px; right: 36px; top: 118px;
    bottom: 24px;
  }
  .scene-box.gone { display: none; }

  .sheet {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 12px #0001;
    padding: 18px 28px 16px;
  }
  .eq {
    display: flex;
    align-items: center;
    min-height: 46px;
    font-size: 22px;
    font-weight: 800;
    color: #3a4a58;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .3s, transform .3s, background .3s;
    padding: 4px 10px;
    border-radius: 10px;
  }
  .eq.on {
    opacity: 1;
    transform: none;
  }
  .eq.hot {
    background: #fff6d8;
    color: #8a5a10;
  }
  .eq b { color: #e0662c; }
  .eq .dim { color: #8aa0b3; font-weight: 800; }

  .brace-box {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity .35s;
  }
  .brace-box.on { opacity: 1; }
  .brace {
    font-size: 72px;
    line-height: 0.8;
    color: #2c6fb3;
    font-weight: 400;
    padding-bottom: 8px;
  }
  .brace-eqs { display: flex; flex-direction: column; gap: 4px; }
  .brace-eqs .eq { min-height: 40px; }

  .note {
    margin-top: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: #8a5a10;
    min-height: 28px;
  }
  .note b { color: #e0662c; }

  .bar-box {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .bar-box.show { opacity: 1; }
</style>
</head>
<body>

<h1>联欢会握手：最后一个是第几个，少握几个减 1</h1>
<div class="problem">
  50 人联欢。第 1 个女生和<b>全部男生</b>握手，第 2 个少 1 个，最后那个只握了 <b>7</b> 个。男生多少人？
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="scene-box" id="boxSheet">
      <div class="sheet" id="sheet"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="bar-box" id="barBox"></div>
  </div>
</div>

<script src="lib/anim.js"></script>
<script src="lib/bars.js"></script>
<script>
const { sleep, cancelled, say } = Anim;

const bars = Bars.create({
  stage: document.getElementById('barBox'),
  items: [
    { name: '男生', color: '#3d8bd8' },
    { name: '女生', color: '#e36b8a' },
  ],
  scale: 9,
  unit: ' 人',
  padding: 170,
});

function show(which) {
  document.getElementById('boxSheet').classList.toggle('gone', which !== 'sheet');
  document.getElementById('barBox').classList.toggle('show', which === 'bars');
}

function paintSheet(rows, hot) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  rows.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'eq on' + (i === hot ? ' hot' : '');
    el.innerHTML = html;
    sheet.appendChild(el);
  });
}

function resetVisuals() {
  document.getElementById('sheet').innerHTML = '';
  document.getElementById('note').textContent = '';
  show('sheet');
  bars.reset();
  bars.set([0, 0]);
}

const ROW1 = '第 <b>1</b> 个女生 → 全部男生';
const ROW2 = '第 <b>2</b> 个女生 → 全部男生 − 1';
const ROW3 = '第 <b>3</b> 个女生 → 全部男生 − 2';
const DOTS = '<span class="dim">……</span>';
const LAST = '最后（第 <b>女生人数</b> 个）→ 男生 −（女生 − 1）= <b>7</b>';

Anim.run([
  {
    title: '一个比一个少 1',
    async play(id) {
      paintSheet([ROW1], 0);
      say('第 1 个', '第 1 个女生和<b>全部男生</b>握过手。');
      await sleep(700);
      if (cancelled(id)) return;
      paintSheet([ROW1, ROW2], 1);
      say('第 2 个', '第 2 个女生少握 <b>1</b> 个。');
      await sleep(700);
      if (cancelled(id)) return;
      paintSheet([ROW1, ROW2, ROW3], 2);
      say('第 3 个', '第 3 个少握 <b>2</b> 个。每往后一个，就再少 1。');
      await sleep(600);
      if (cancelled(id)) return;
    }
  },
  {
    title: '最后一个是第几个',
    async play(id) {
      paintSheet([ROW1, ROW2, ROW3, DOTS, LAST], 4);
      document.getElementById('note').innerHTML = '有几个女生，最后那个就是第几个';
      say('第几个', '最后那个女生，就是第 <b>女生人数</b> 个。第几个，就比第 1 个少握「几个 − 1」。');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '写成一句话',
    async play(id) {
      paintSheet([
        LAST,
        '也就是：男生 −（女生 − 1）= <b>7</b>',
      ], 1);
      document.getElementById('note').innerHTML = '少握的个数 = 女生人数 − 1';
      say('式子', '第 1 个握「男生」这么多。最后少握了（女生 − 1）个，剩下 <b>7</b> 个。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '挪一下，多 6',
    async play(id) {
      paintSheet([
        '男生 −（女生 − 1）= 7',
        '男生 − 女生 + 1 = 7',
        '男生 − 女生 = <b>6</b>',
      ], 2);
      document.getElementById('note').innerHTML = '括号拆开，+1 挪到右边：7 − 1 = 6';
      say('多 6', '括号拆开：男生 − 女生 + 1 = 7。把 +1 挪过去，男生比女生<b>多 6</b>。');
      await sleep(900);
      if (cancelled(id)) return;
    }
  },
  {
    title: '再加上一共 50',
    async play(id) {
      const sheet = document.getElementById('sheet');
      sheet.innerHTML =
        '<div class="brace-box on">' +
          '<div class="brace">{</div>' +
          '<div class="brace-eqs">' +
            '<div class="eq on hot">男生 − 女生 = <b>6</b></div>' +
            '<div class="eq on">男生 + 女生 = <b>50</b></div>' +
          '</div>' +
        '</div>';
      document.getElementById('note').innerHTML = '差 6，和 50，就是和差';
      say('两句话', '男生比女生多 6，两人加起来 50。这就是已经会的<b>和差</b>。');
      await sleep(800);
      if (cancelled(id)) return;
    }
  },
  {
    title: '和差收口',
    async play(id) {
      show('bars');
      bars.set([28, 22]);
      say('和差', '一共 <b>50</b>，多 6。把多的 6 拿掉，剩下两份一样长。');
      await sleep(500);
      if (cancelled(id)) return;
      bars.diff(0, 1, '多 6');
      await sleep(500);
      if (cancelled(id)) return;
      bars.showNumbers(true);
    }
  },
  {
    title: '男生 28 人',
    async play(id) {
      show('bars');
      bars.set([28, 22]);
      bars.showNumbers(true);
      bars.diff(0, 1, '多 6');
      say('答案', '男生 <b>28</b> 人，女生 22 人。（50 + 6）÷ 2 = 28。');
      await sleep(400);
      if (cancelled(id)) return;
    }
  },
], { reset: resetVisuals });
</script>
</body>
</html>
